{{- $d := .Values.frulab.docker }}
{{- if and $d.enabled (not $d.webconsoleHost) }}
{{- fail "frulab.docker.webconsoleHost is required when frulab.docker.enabled (the node's IP)" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "frulab.name" . }}-config
  labels:
    {{- include "frulab.labels" . | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    backend:
      username: {{ .Values.frulab.username | quote }}
      password: {{ .Values.frulab.password | quote }}
      port: {{ .Values.frulab.service.port }}
      jwt:
        secret: {{ .Values.frulab.jwt.secret | quote }}
        expiresIn: {{ .Values.frulab.jwt.expiresIn }}
      db:
        type: "bbolt"
        path: "./db/frulab.db"
      deploy:
        workDir: {{ $d.workDir | quote }}
        timeout: {{ $d.timeout }}
        webconsole:
          port: {{ $d.webconsolePort }}
          host: {{ $d.webconsoleHost | default "localhost" | quote }}
      frontendFilePath: "frontend"
      tester:
        {{- if .Values.tester.enabled }}
        url: "http://{{ include "tester.name" . }}:{{ .Values.tester.port }}"
        {{- else }}
        url: ""
        {{- end }}
        apiToken: {{ .Values.tester.apiToken | quote }}
    logger:
      level: {{ .Values.frulab.logLevel | quote }}
