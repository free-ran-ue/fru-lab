{{- if .Values.tester.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tester.name" . }}-config
  labels:
    {{- include "frulab.labels" . | nindent 4 }}
type: Opaque
stringData:
  tester.yaml: |
    listen: "0.0.0.0:{{ .Values.tester.port }}"
    apiToken: {{ .Values.tester.apiToken | quote }}
    logger:
      level: {{ .Values.tester.logLevel | quote }}
    systemFile: "data/tester-system.json"
{{- end }}
