{{- if .Values.tester.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tester.name" . }}
  labels:
    {{- include "frulab.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tester.selector" . | nindent 4 }}
  ports:
    - name: api
      port: {{ .Values.tester.port }}
      targetPort: api
{{- end }}
