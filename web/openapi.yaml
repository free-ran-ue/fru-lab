openapi: 3.0.3
info:
  title: full-stack-framework API
  description: Automatically generated OpenAPI spec from Postman collection "full-stack-framework"
  version: 1.0.0
servers:
  - url: http://127.0.0.1:5000
    description: Default local server
paths:
  /api/login:
    post:
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/logout:
    post:
      summary: Logout
      operationId: logout
      responses:
        '204':
          description: No Content

  /api/deploy/free5gc:
    post:
      summary: Deploy free5GC
      description: Deploys one of free5gc's compose templates (see RequestDeployFree5gc.template). Omitting the request body deploys "basic".
      operationId: deployFree5gcUp
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDeployFree5gc'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request - unknown template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop free5GC
      description: Fails with 409 if gNB is still running - gNB must be stopped first.
      operationId: deployFree5gcDown
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - gNB is still running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/free5gc/status:
    get:
      summary: Get free5GC deploy status
      operationId: deployFree5gcStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'

  /api/deploy/free5gc/logs:
    get:
      summary: Get free5GC container logs
      operationId: deployFree5gcLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LogService'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'

  /api/deploy/gnb:
    post:
      summary: Deploy gNB
      description: Fails with 409 if the core network isn't running yet - deploy free5gc first. This is the singleton gNB used by the basic/ulcl free5gc templates - see /api/deploy/gnb-slice/{slice} for ulcl-2slice.
      operationId: deployGnbUp
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - the core network isn't running yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop gNB
      description: Fails with 409 if any UE instance is still running - all UE instances must be stopped first.
      operationId: deployGnbDown
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - a UE instance is still running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/gnb/status:
    get:
      summary: Get gNB deploy status
      operationId: deployGnbStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'

  /api/deploy/gnb/logs:
    get:
      summary: Get gNB container logs
      operationId: deployGnbLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LogService'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'

  /api/deploy/gnb-slice/{slice}:
    post:
      summary: Deploy a gNB slice (ulcl-2slice only)
      description: Deploys the gNB dedicated to one slice of the ulcl-2slice free5gc template. Unlike /api/deploy/gnb, gnb-slice1 and gnb-slice2 are independent and can both be deployed at the same time. Fails with 409 if the core network isn't running yet.
      operationId: deployGnbSliceUp
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GnbSlice'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown slice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - the core network isn't running yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop a gNB slice (ulcl-2slice only)
      description: Fails with 409 if any UE instance is still running - all UE instances must be stopped first.
      operationId: deployGnbSliceDown
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GnbSlice'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown slice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - a UE instance is still running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/gnb-slice/{slice}/status:
    get:
      summary: Get a gNB slice's deploy status
      operationId: deployGnbSliceStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GnbSlice'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown slice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'

  /api/deploy/gnb-slice/{slice}/logs:
    get:
      summary: Get a gNB slice's container logs
      operationId: deployGnbSliceLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GnbSlice'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown slice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'

  /api/deploy/ue:
    get:
      summary: List all deployed UE instances
      operationId: deployUeList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeListResponse'

  /api/deploy/ue/{instance}:
    post:
      summary: Deploy a UE instance for one subscriber
      description: Fails with 409 if gNB isn't running yet - deploy gNB first.
      operationId: deployUeUp
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployUeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - gNB isn't running yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop a UE instance
      operationId: deployUeDown
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/ue/{instance}/status:
    get:
      summary: Get a UE instance's deploy status
      operationId: deployUeStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeStatusResponse'

  /api/deploy/ue/{instance}/logs:
    get:
      summary: Get a UE instance's container logs
      operationId: deployUeLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeLogsResponse'

  /api/images:
    get:
      summary: List the images this app deploys
      description: Reports every image pinned by the compose templates (free5gc's NFs, mongo, and free-ran-ue), and whether each is currently present in the local docker image cache.
      operationId: imageList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'

  /api/images/{key}:
    delete:
      summary: Clear a locally cached image
      description: Removes the image from the local docker image cache, forcing the next deploy to pull it fresh. Fails if a container is currently using it.
      operationId: imageRemove
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown image key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/images/{key}/pull:
    post:
      summary: Pull an image
      description: Re-pulls the image's pinned tag from its registry.
      operationId: imagePull
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown image key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/tester/profile:
    get:
      summary: Get the saved Throughput Tester profile
      description: Returns the last profile saved from the setup page. 204 when none has been saved yet.
      operationId: testerProfileGet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterProfile'
        '204':
          description: No profile saved yet
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    put:
      summary: Save the Throughput Tester profile
      description: Stores the profile as-is. Field validation is done by POST /api/tester/profile/validate, not here.
      operationId: testerProfilePut
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TesterProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Body is not a JSON object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/tester/profile/validate:
    post:
      summary: Validate a profile and preview the per-gNB plan
      description: Forwarded to fru-tester. Always 200 for a well-formed body; `valid` says whether the profile can start a run.
      operationId: testerProfileValidate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TesterProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterValidateResponse'
        '502':
          description: fru-tester is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '503':
          description: backend.tester.url is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/tester/run:
    get:
      summary: Current run snapshot
      description: Forwarded to fru-tester. State is `idle` before the first run.
      operationId: testerRunGet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterRunSnapshot'
        '502':
          description: fru-tester is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '503':
          description: backend.tester.url is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    post:
      summary: Start a run
      description: Forwarded to fru-tester. Only one run may be active at a time.
      operationId: testerRunStart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TesterProfile'
      responses:
        '202':
          description: Run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterRunSnapshot'
        '400':
          description: Profile is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterStartErrorResponse'
        '409':
          description: A run is already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '502':
          description: fru-tester is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '503':
          description: backend.tester.url is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/tester/run/stop:
    post:
      summary: Stop the active run
      description: Stops the traffic, deregisters every registered UE, closes every N2 association and removes what fru-tester added. During that cleanup (`stopping`), a second call skips the deregistrations still pending. Returns at once; watch the stream for `stopped`.
      operationId: testerRunStop
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Stop requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterRunSnapshot'
        '409':
          description: No active run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/tester/network/interfaces:
    get:
      summary: Interfaces on fru-tester's host
      description: Forwarded to fru-tester. Every link on the host where fru-tester runs, for the Setup page's interface menus.
      operationId: testerNetworkInterfaces
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TesterInterface'
        '502':
          description: fru-tester is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '503':
          description: backend.tester.url is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/tester/network/ping:
    post:
      summary: Ping test of one network
      description: Forwarded to fru-tester. Puts the address a run would add for that network on its interface (the first gNB IP with the CIDR's prefix for N2 and N3, the sink for N6) unless the host has it, pings the AMF, the UPF's N3 or the UPF's N6 three times, and removes the address again. Only that network's fields are checked. Not while a run is active.
      operationId: testerNetworkPing
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TesterPingRequest'
      responses:
        '200':
          description: Test done; received may be 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterPingResult'
        '400':
          description: That network's settings are wrong (errors lists the fields), or an unknown plane
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterStartErrorResponse'
        '409':
          description: A run or another ping test is active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/tester/bench:
    get:
      summary: Latest data plane bench
      description: Forwarded to fru-tester. State is `idle` before the first bench.
      operationId: testerBenchGet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterBenchResult'
    post:
      summary: Start a data plane bench
      description: Measures how fast this host's fru-tester can send, over loopback with no core network, with 1, 2, 4 … senders up to one per CPU. Not while a run is active.
      operationId: testerBenchStart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TesterBenchSettings'
      responses:
        '202':
          description: Bench started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterBenchResult'
        '400':
          description: Invalid settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: A bench or a run is already running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/tester/history:
    get:
      summary: Finished runs, newest first
      description: fru-lab keeps the last 50 runs fru-tester finished.
      operationId: testerHistoryList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TesterHistorySummary'
  /api/tester/history/{runId}:
    get:
      summary: One finished run's full report (JSON export)
      operationId: testerHistoryGet
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The profile the run used and its final snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterRunReport'
        '404':
          description: No such run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/tester/history/{runId}/series.csv:
    get:
      summary: One finished run's throughput time series (CSV export)
      operationId: testerHistorySeriesCsv
      security:
        - bearerAuth: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 't,ulTxBps,ulRxBps,dlTxBps,dlRxBps, one row per chart point'
          content:
            text/csv:
              schema:
                type: string
        '404':
          description: No such run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UeInstance:
      name: instance
      in: path
      required: true
      description: The subscriber's UE ID (IMSI), used as the UE instance identifier.
      schema:
        type: string
        example: imsi-208930000000001
    LogService:
      name: service
      in: query
      required: false
      description: Filter logs down to one compose service (NF), e.g. "amf". Omit for every service in the project.
      schema:
        type: string
        example: amf
    ImageKey:
      name: key
      in: path
      required: true
      description: The image's stable route key, as returned by GET /api/images (e.g. "amf", "mongo", "free-ran-ue").
      schema:
        type: string
        example: amf
    GnbSlice:
      name: slice
      in: path
      required: true
      description: Which ulcl-2slice slice's gNB to act on.
      schema:
        type: string
        enum:
          - slice1
          - slice2
        example: slice1
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: '0000'
    LoginResponse:
      type: object
      required:
        - message
        - token
      properties:
        message:
          type: string
        token:
          type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    DeployStatusResponse:
      type: object
      required:
        - target
        - status
      properties:
        target:
          type: string
          example: free5gc
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
    ServiceStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          example: amf
        status:
          type: string
          example: running
    DeployLogsResponse:
      type: object
      required:
        - target
        - lines
      properties:
        target:
          type: string
          example: free5gc
        lines:
          type: array
          items:
            type: string
          example:
            - 'amf         | [INFO] AMF started, PLMN 208/93, listening on N2'
    RequestDeployFree5gc:
      type: object
      properties:
        template:
          type: string
          description: Which free5gc compose template to deploy. Defaults to "basic" when omitted.
          enum:
            - basic
            - ulcl
            - ulcl-2slice
          example: basic
    DeployUeRequest:
      type: object
      required:
        - mcc
        - mnc
        - msin
        - permanentKey
        - opValue
        - amf
        - sqn
        - dnn
        - sst
      properties:
        mcc:
          type: string
          example: '208'
        mnc:
          type: string
          example: '93'
        msin:
          type: string
          example: '0000000001'
        permanentKey:
          type: string
          example: 8baf473f2f8fd09487cccbd7097c6862
        opValue:
          type: string
          example: 8e27b6af0e692e750f32667a3b14605d
        amf:
          type: string
          example: '8000'
        sqn:
          type: string
          example: '000000000023'
        dnn:
          type: string
          example: internet
        sst:
          type: string
          example: '1'
        sd:
          type: string
          example: '010203'
    DeployUeStatusResponse:
      type: object
      required:
        - instance
        - status
      properties:
        instance:
          type: string
          example: imsi-208930000000001
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
    DeployUeLogsResponse:
      type: object
      required:
        - instance
        - lines
      properties:
        instance:
          type: string
          example: imsi-208930000000001
        lines:
          type: array
          items:
            type: string
    DeployUeListResponse:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/DeployUeStatusResponse'
    ImageInfo:
      type: object
      required:
        - key
        - name
        - image
        - group
        - present
      properties:
        key:
          type: string
          example: amf
        name:
          type: string
          example: AMF
        image:
          type: string
          example: free5gc/amf:latest
        group:
          type: string
          example: free5gc
        present:
          type: boolean
          description: Whether the image is currently present in the local docker image cache.
        size:
          type: integer
          format: int64
          description: Image size in bytes. Omitted when not present locally.
        createdAt:
          type: string
          format: date-time
          description: When the locally cached image was built. Omitted when not present locally.
    ImageListResponse:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageInfo'
    TesterProfile:
      type: object
      required: [name, scale, gnb, ue, traffic, network, rates]
      properties:
        name:
          type: string
          example: 1000 UE baseline
        scale:
          type: object
          required: [gnbCount, ueCount]
          properties:
            gnbCount:
              type: integer
              example: 10
            ueCount:
              type: integer
              example: 1000
        gnb:
          type: object
          required: [gnbIdStart, namePattern, mcc, mnc, tac, sst, sd]
          properties:
            gnbIdStart:
              type: string
              description: 6 or 8 hex digits; incremented per gNB, keeping its width.
              example: '000314'
            namePattern:
              type: string
              description: Must contain {i}, replaced by the 1-based gNB index.
              example: gNB-{i}
            mcc:
              type: string
              example: '208'
            mnc:
              type: string
              example: '93'
            tac:
              type: string
              example: '000001'
            sst:
              type: integer
              example: 1
            sd:
              type: string
              description: Empty or 6 hex digits.
              example: '010203'
        ue:
          $ref: '#/components/schemas/TesterUeTemplate'
        traffic:
          $ref: '#/components/schemas/TesterTraffic'
        network:
          type: object
          required: [n2, n3, n6]
          properties:
            n2:
              type: object
              required: [interface, cidr, startIp, amfIp, amfPort]
              properties:
                interface:
                  type: string
                  example: ens19
                cidr:
                  type: string
                  example: 10.0.1.0/24
                startIp:
                  type: string
                  example: 10.0.1.100
                amfIp:
                  type: string
                  example: 10.0.1.1
                amfPort:
                  type: integer
                  example: 38412
            n3:
              type: object
              required: [interface, cidr, startIp, upfIp, upfPort]
              properties:
                interface:
                  type: string
                  example: ens20
                cidr:
                  type: string
                  example: 10.0.2.0/24
                startIp:
                  type: string
                  example: 10.0.2.100
                upfIp:
                  type: string
                  example: 10.0.2.1
                upfPort:
                  type: integer
                  example: 2152
            n6:
              type: object
              description: Data-network side. Uplink is addressed to the sink; downlink is sent from it to the UEs, whose pool is routed via upfIp for the run.
              required: [interface, sinkIp, upfIp, uePool]
              properties:
                interface:
                  type: string
                  example: docker-cn-ran
                sinkIp:
                  type: string
                  description: The sink's address with its prefix length, as it goes on the interface (e.g. 172.26.6.1/16). If the host does not have the address, the tester adds it to the interface for the run with that prefix, which also gives the host a route to the subnet; it is removed afterwards.
                  example: 10.0.1.1/24
                upfIp:
                  type: string
                  example: 10.0.1.5
                uePool:
                  type: string
                  example: 10.60.0.0/16
        rates:
          type: object
          required: [n2, registration, pdu, deregistration]
          properties:
            n2:
              $ref: '#/components/schemas/TesterStageRate'
            registration:
              $ref: '#/components/schemas/TesterProcedureRate'
            pdu:
              $ref: '#/components/schemas/TesterProcedureRate'
            deregistration:
              $ref: '#/components/schemas/TesterProcedureRate'
    TesterTraffic:
      type: object
      description: Fixed-rate traffic of every established UE. packetSize is the inner IP packet length.
      required: [ulMbps, dlMbps, packetSize, port, maxDurationMin, dlBatchMs, engine]
      properties:
        ulMbps:
          type: number
          description: Per UE; 0 disables uplink.
          example: 1
        dlMbps:
          type: number
          description: Per UE; 0 disables downlink.
          example: 5
        packetSize:
          type: integer
          description: 64..9000, and at most the N3 interface's MTU minus 44 (GTP-U and its headers) and the N6 interface's MTU; 1456 on a 1500 MTU network.
          example: 1400
        port:
          type: integer
          description: UDP port at the N6 sink and at the UEs.
          example: 9200
        maxDurationMin:
          type: integer
          description: Stop the run this many minutes after it started, exactly like pressing Stop. 0 = run until Stop.
          example: 0
        dlBatchMs:
          type: integer
          description: Send each UE this many milliseconds of downlink in a row (0..10), so UDP GSO can send them in one piece. 0 = one packet per UE in turn. Uplink needs no grouping.
          example: 1
        engine:
          type: string
          enum: ['', auto, socket, afxdp]
          description: How the data plane moves packets. socket = UDP sockets (also when empty). afxdp = AF_XDP on the N3 and N6 interfaces, skipping the kernel's IP/UDP/socket code (zero-copy when the driver supports it, else copy or generic mode). auto = AF_XDP when both interfaces are NICs and it starts, else sockets.
          example: auto
    TesterUeTemplate:
      type: object
      description: Expanded once per UE. MCC/MNC come from the gNB template; MCC+MNC+MSIN must be 15 digits. Key/OPc/AMF/SQN must match the subscribers created in the core.
      required: [msinStart, key, opc, amf, sqn, integrity, ciphering, dnn, sst, sd]
      properties:
        msinStart:
          type: string
          description: Decimal; incremented per UE, keeping its width.
          example: '0000000001'
        key:
          type: string
          example: 8baf473f2f8fd09487cccbd7097c6862
        opc:
          type: string
          example: 8e27b6af0e692e750f32667a3b14605d
        amf:
          type: string
          example: '8000'
        sqn:
          type: string
          example: '000000000023'
        integrity:
          type: string
          enum: [nia0, nia1, nia2, nia3]
        ciphering:
          type: string
          enum: [nea0, nea1, nea2, nea3]
        dnn:
          type: string
          example: internet
        sst:
          type: integer
          example: 1
        sd:
          type: string
          example: '010203'
    TesterProcedureRate:
      type: object
      description: At most ratePerSec new attempts per second and at most maxInFlight at once; each attempt bounded by timeoutMs; a failed UE with retries left is requeued at the back.
      required: [ratePerSec, maxInFlight, timeoutMs, retries]
      properties:
        ratePerSec:
          type: integer
          example: 50
        maxInFlight:
          type: integer
          example: 200
        timeoutMs:
          type: integer
          example: 10000
        retries:
          type: integer
          example: 1
    TesterStageRate:
      type: object
      required: [timeoutMs, retries]
      properties:
        timeoutMs:
          type: integer
          example: 5000
        retries:
          type: integer
          example: 1
    TesterFieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: network.n2.cidr
        message:
          type: string
    TesterGnbSpec:
      type: object
      required: [index, name, gnbId, n2Ip, n3Ip, ueCount, ueFirst, ueLast, firstSupi, lastSupi]
      properties:
        index:
          type: integer
        name:
          type: string
        gnbId:
          type: string
        n2Ip:
          type: string
        n3Ip:
          type: string
        ueCount:
          type: integer
        ueFirst:
          type: integer
          description: 1-based index of the first UE on this gNB; 0 when it has none.
        ueLast:
          type: integer
        firstSupi:
          type: string
          description: SUPI of this gNB's first UE; empty when it has none.
          example: imsi-208930000000001
        lastSupi:
          type: string
    TesterPlan:
      type: object
      required: [gnbs, uesPerGnb, n2Prefix, n3Prefix]
      properties:
        gnbs:
          type: array
          items:
            $ref: '#/components/schemas/TesterGnbSpec'
        uesPerGnb:
          type: integer
        n2Prefix:
          type: integer
        n3Prefix:
          type: integer
    TesterValidateResponse:
      type: object
      required: [valid, errors]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TesterFieldError'
        plan:
          allOf:
            - $ref: '#/components/schemas/TesterPlan'
          nullable: true
    TesterStartErrorResponse:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TesterFieldError'
    TesterCauseCount:
      type: object
      required: [cause, count]
      properties:
        cause:
          type: string
          example: misc(4)
        count:
          type: integer
          format: int64
    TesterStageSnapshot:
      type: object
      description: One stage card. Latencies are milliseconds over accepted items only; totalTimeMs is first start to last finish.
      required: [name, expected, attempted, retries, inFlight, accepted, rejected, timedOut, failed, skipped, done, totalTimeMs, avgMs, p50Ms, p95Ms, p99Ms, maxMs, causes]
      properties:
        name:
          type: string
        expected:
          type: integer
        attempted:
          type: integer
          format: int64
        retries:
          type: integer
          format: int64
        inFlight:
          type: integer
          format: int64
        accepted:
          type: integer
          format: int64
        rejected:
          type: integer
          format: int64
        timedOut:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        skipped:
          type: integer
          format: int64
          description: Never attempted (gNB down, earlier stage failed, or the run was stopped first).
        done:
          type: boolean
        totalTimeMs:
          type: number
        avgMs:
          type: number
        p50Ms:
          type: number
        p95Ms:
          type: number
        p99Ms:
          type: number
        maxMs:
          type: number
        causes:
          type: array
          items:
            $ref: '#/components/schemas/TesterCauseCount'
    TesterGnbStatus:
      allOf:
        - $ref: '#/components/schemas/TesterGnbSpec'
        - type: object
          required: [state, attempts, latencyMs, cause, registered, established]
          properties:
            state:
              type: string
              enum: [pending, connecting, up, failed, lost, closed]
              description: lost = was up, then the AMF side dropped the association.
            attempts:
              type: integer
            latencyMs:
              type: number
            cause:
              type: string
            registered:
              type: integer
            established:
              type: integer
    TesterRunSnapshot:
      type: object
      required: [runId, profileName, state, error, n2, registration, pdu, deregistration, n2Release, stopReason, gnbs, ues, failedUes, dataplane]
      properties:
        runId:
          type: string
        profileName:
          type: string
        state:
          type: string
          enum: [idle, configuring, n2, running, stopping, stopped, failed]
        error:
          type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        stoppedAt:
          type: string
          format: date-time
          nullable: true
        n2:
          $ref: '#/components/schemas/TesterStageSnapshot'
        registration:
          $ref: '#/components/schemas/TesterStageSnapshot'
        pdu:
          $ref: '#/components/schemas/TesterStageSnapshot'
        deregistration:
          $ref: '#/components/schemas/TesterStageSnapshot'
        n2Release:
          $ref: '#/components/schemas/TesterStageSnapshot'
        stopReason:
          type: string
          description: Why the run stopped; empty while running.
          enum: ['', user, maxDuration]
        gnbs:
          type: array
          items:
            $ref: '#/components/schemas/TesterGnbStatus'
        ues:
          $ref: '#/components/schemas/TesterUeSummary'
        failedUes:
          type: array
          description: The first 200 UEs that failed; ues.failed has the total.
          items:
            $ref: '#/components/schemas/TesterUeFailure'
        dataplane:
          $ref: '#/components/schemas/TesterDataplaneSnapshot'
    TesterDataplaneSnapshot:
      type: object
      required: [engine, activeUes, ul, dl, gnbs, series]
      properties:
        engine:
          type: string
          description: 'How packets move, e.g. "socket", "socket (auto: docker-cn-ran is a bridge, not a NIC)" or "af_xdp (ens2f1 zero-copy, 8 queues)".'
          example: af_xdp (ens2f1 zero-copy, 8 queues)
        activeUes:
          type: integer
        ul:
          $ref: '#/components/schemas/TesterTrafficDirection'
        dl:
          $ref: '#/components/schemas/TesterTrafficDirection'
        gnbs:
          type: array
          description: Per gNB, same order as gnbs in the run snapshot.
          items:
            $ref: '#/components/schemas/TesterGnbTraffic'
        series:
          type: array
          description: The whole run from its first second, in at most 600 points. A point covers 1 second until the run outgrows that, then 2, 4, 8 ... seconds (averaged).
          items:
            $ref: '#/components/schemas/TesterTrafficPoint'
    TesterTrafficDirection:
      type: object
      description: Tx is what the tester sent; Rx is what came back through the UPF. Bytes are inner IP packet bytes; rates are over the last second.
      required: [txPackets, txBytes, rxPackets, rxBytes, txBps, rxBps, txPps, rxPps, lossRate, outOfOrder, sendErrors, misrouted, latency]
      properties:
        txPackets:
          type: integer
          format: int64
        txBytes:
          type: integer
          format: int64
        rxPackets:
          type: integer
          format: int64
        rxBytes:
          type: integer
          format: int64
        txBps:
          type: number
        rxBps:
          type: number
        txPps:
          type: number
        rxPps:
          type: number
        lossRate:
          type: number
          description: 1 - rx/tx so far.
        outOfOrder:
          type: integer
          format: int64
        sendErrors:
          type: integer
          format: int64
        misrouted:
          type: integer
          format: int64
          description: Downlink that arrived in another UE's tunnel or at another gNB. Always 0 for uplink.
        latency:
          $ref: '#/components/schemas/TesterLatency'
    TesterLatency:
      type: object
      description: One-way latency in milliseconds (send and receive share the host clock).
      required: [count, avgMs, p50Ms, p99Ms, maxMs]
      properties:
        count:
          type: integer
          format: int64
        avgMs:
          type: number
        p50Ms:
          type: number
        p99Ms:
          type: number
        maxMs:
          type: number
    TesterGnbTraffic:
      type: object
      required: [ulTxBytes, ulRxBytes, dlTxBytes, dlRxBytes]
      properties:
        ulTxBytes:
          type: integer
          format: int64
        ulRxBytes:
          type: integer
          format: int64
        dlTxBytes:
          type: integer
          format: int64
        dlRxBytes:
          type: integer
          format: int64
    TesterTrafficPoint:
      type: object
      required: [t, ulTxBps, ulRxBps, dlTxBps, dlRxBps]
      properties:
        t:
          type: number
          description: Seconds since traffic started.
        ulTxBps:
          type: number
        ulRxBps:
          type: number
        dlTxBps:
          type: number
        dlRxBps:
          type: number
    TesterUeSummary:
      type: object
      description: UEs per pipeline state; the fields add up to the UE count.
      required: [pending, registering, registered, establishing, established, failed, skipped, cancelled, deregistering, deregistered]
      properties:
        pending:
          type: integer
        registering:
          type: integer
        registered:
          type: integer
        establishing:
          type: integer
        established:
          type: integer
        failed:
          type: integer
        skipped:
          type: integer
        cancelled:
          type: integer
        deregistering:
          type: integer
        deregistered:
          type: integer
    TesterRunReport:
      type: object
      required: [profile, snapshot]
      properties:
        profile:
          $ref: '#/components/schemas/TesterProfile'
        snapshot:
          $ref: '#/components/schemas/TesterRunSnapshot'
    TesterHistorySummary:
      type: object
      required: [runId, profileName, state, error, stopReason, gnbCount, ueCount, registered, registrationP95Ms, established, deregistered, ulTxBytes, ulRxBytes, ulLossRate, dlTxBytes, dlRxBytes, dlLossRate]
      properties:
        runId:
          type: string
        profileName:
          type: string
        state:
          type: string
        error:
          type: string
        stopReason:
          type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        stoppedAt:
          type: string
          format: date-time
          nullable: true
        gnbCount:
          type: integer
        ueCount:
          type: integer
        registered:
          type: integer
          format: int64
        registrationP95Ms:
          type: number
        established:
          type: integer
          format: int64
        deregistered:
          type: integer
          format: int64
        ulTxBytes:
          type: integer
          format: int64
        ulRxBytes:
          type: integer
          format: int64
        ulLossRate:
          type: number
        dlTxBytes:
          type: integer
          format: int64
        dlRxBytes:
          type: integer
          format: int64
        dlLossRate:
          type: number
    TesterInterface:
      type: object
      required: [name, kind, state, mtu, addresses]
      properties:
        name:
          type: string
          example: ens2f1
        kind:
          type: string
          description: Link type, e.g. device (a NIC), bridge, veth, macvlan, vlan, bond.
          example: device
        state:
          type: string
          description: Operational state, e.g. up, down, unknown.
          example: up
        mtu:
          type: integer
          example: 1500
        addresses:
          type: array
          description: IPv4 addresses with prefix length.
          items:
            type: string
    TesterPingRequest:
      type: object
      required: [plane, profile]
      properties:
        plane:
          type: string
          enum: [n2, n3, n6]
        profile:
          $ref: '#/components/schemas/TesterProfile'
    TesterPingResult:
      type: object
      required: [plane, interface, source, target, added, sent, received, rttMs, error]
      properties:
        plane:
          type: string
          enum: [n2, n3, n6]
        interface:
          type: string
        source:
          type: string
          description: The address the test used, with its prefix length.
          example: 10.0.1.100/24
        target:
          type: string
          description: The AMF (N2), the UPF's N3 or the UPF's N6 address.
        added:
          type: boolean
          description: The source was added to the interface for the test and removed again.
        sent:
          type: integer
        received:
          type: integer
        rttMs:
          type: array
          items:
            type: number
        error:
          type: string
          description: Why the test could not run (e.g. the address could not be added) or a send error such as no route to host; empty otherwise.
    TesterBenchSettings:
      type: object
      required: [packetSize, stepSeconds, gso]
      properties:
        packetSize:
          type: integer
          description: Inner IP packet bytes, 64..9000.
          example: 1400
        stepSeconds:
          type: integer
          description: Measuring time per sender count, 1..30.
          example: 3
        gso:
          type: boolean
          description: Send with UDP GSO, as runs do; off measures plain sendmmsg, as on a kernel without GSO.
          example: true
    TesterBenchStep:
      type: object
      required: [senders, pps, bps, sendErrors, gso]
      properties:
        senders:
          type: integer
        pps:
          type: number
        bps:
          type: number
          description: Inner IP bits per second.
        sendErrors:
          type: integer
          format: int64
        gso:
          type: boolean
          description: Whether the senders did use UDP GSO (false if the kernel refused it).
    TesterBenchResult:
      type: object
      required: [state, error, cpus, kernel, settings, plannedSenders, steps]
      properties:
        state:
          type: string
          enum: [idle, running, done, failed]
        error:
          type: string
        cpus:
          type: integer
        kernel:
          type: string
        settings:
          $ref: '#/components/schemas/TesterBenchSettings'
        plannedSenders:
          type: array
          items:
            type: integer
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TesterBenchStep'
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
    TesterUeFailure:
      type: object
      required: [supi, gnb, stage, cause, attempts]
      properties:
        supi:
          type: string
        gnb:
          type: string
        stage:
          type: string
          enum: [registration, pdu, deregistration]
        cause:
          type: string
          example: 5gmm(62)
        attempts:
          type: integer
