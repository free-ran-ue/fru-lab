      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreNetwork'
      responses:
        '200':
          description: The saved core network, with its id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreNetwork'
        '400':
          description: Bad Request - a field is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - the name is taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/core-networks/{id}:
    put:
      summary: Update a core network
      operationId: coreNetworkUpdate
