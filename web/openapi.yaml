openapi: 3.0.3
info:
  title: full-stack-framework API
  description: Automatically generated OpenAPI spec from Postman collection "full-stack-framework"
  version: 1.0.0
servers:
  - url: http://127.0.0.1:5000
    description: Default local server
paths:
  /api/login:
    post:
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/logout:
    post:
      summary: Logout
      operationId: logout
      responses:
        '204':
          description: No Content

  /api/deploy/free5gc:
    post:
      summary: Deploy free5GC
      description: Deploys one of free5gc's compose templates (see RequestDeployFree5gc.template). Omitting the request body deploys "basic".
      operationId: deployFree5gcUp
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDeployFree5gc'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request - unknown template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop free5GC
      description: Fails with 409 if gNB is still running - gNB must be stopped first.
      operationId: deployFree5gcDown
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - gNB is still running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/free5gc/status:
    get:
      summary: Get free5GC deploy status
      operationId: deployFree5gcStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'

  /api/deploy/free5gc/logs:
    get:
      summary: Get free5GC container logs
      operationId: deployFree5gcLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LogService'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'

  /api/deploy/gnb:
    post:
      summary: Deploy gNB
      description: Fails with 409 if the core network isn't running yet - deploy free5gc first.
      operationId: deployGnbUp
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - the core network isn't running yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop gNB
      description: Fails with 409 if any UE instance is still running - all UE instances must be stopped first.
      operationId: deployGnbDown
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - a UE instance is still running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/gnb/status:
    get:
      summary: Get gNB deploy status
      operationId: deployGnbStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'

  /api/deploy/gnb/logs:
    get:
      summary: Get gNB container logs
      operationId: deployGnbLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LogService'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'

  /api/deploy/ue:
    get:
      summary: List all deployed UE instances
      operationId: deployUeList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeListResponse'

  /api/deploy/ue/{instance}:
    post:
      summary: Deploy a UE instance for one subscriber
      description: Fails with 409 if gNB isn't running yet - deploy gNB first.
      operationId: deployUeUp
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployUeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - gNB isn't running yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop a UE instance
      operationId: deployUeDown
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/ue/{instance}/status:
    get:
      summary: Get a UE instance's deploy status
      operationId: deployUeStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeStatusResponse'

  /api/deploy/ue/{instance}/logs:
    get:
      summary: Get a UE instance's container logs
      operationId: deployUeLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeLogsResponse'

  /api/images:
    get:
      summary: List the images this app deploys
      description: Reports every image pinned by the compose templates (free5gc's NFs, mongo, and free-ran-ue), and whether each is currently present in the local docker image cache.
      operationId: imageList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'

  /api/images/{key}:
    delete:
      summary: Clear a locally cached image
      description: Removes the image from the local docker image cache, forcing the next deploy to pull it fresh. Fails if a container is currently using it.
      operationId: imageRemove
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown image key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/images/{key}/pull:
    post:
      summary: Pull an image
      description: Re-pulls the image's pinned tag from its registry.
      operationId: imagePull
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown image key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UeInstance:
      name: instance
      in: path
      required: true
      description: The subscriber's UE ID (IMSI), used as the UE instance identifier.
      schema:
        type: string
        example: imsi-208930000000001
    LogService:
      name: service
      in: query
      required: false
      description: Filter logs down to one compose service (NF), e.g. "amf". Omit for every service in the project.
      schema:
        type: string
        example: amf
    ImageKey:
      name: key
      in: path
      required: true
      description: The image's stable route key, as returned by GET /api/images (e.g. "amf", "mongo", "free-ran-ue").
      schema:
        type: string
        example: amf
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: '0000'
    LoginResponse:
      type: object
      required:
        - message
        - token
      properties:
        message:
          type: string
        token:
          type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    DeployStatusResponse:
      type: object
      required:
        - target
        - status
      properties:
        target:
          type: string
          example: free5gc
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
    ServiceStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          example: amf
        status:
          type: string
          example: running
    DeployLogsResponse:
      type: object
      required:
        - target
        - lines
      properties:
        target:
          type: string
          example: free5gc
        lines:
          type: array
          items:
            type: string
          example:
            - 'amf         | [INFO] AMF started, PLMN 208/93, listening on N2'
    RequestDeployFree5gc:
      type: object
      properties:
        template:
          type: string
          description: Which free5gc compose template to deploy. Defaults to "basic" when omitted.
          enum:
            - basic
            - ulcl
          example: basic
    DeployUeRequest:
      type: object
      required:
        - mcc
        - mnc
        - msin
        - permanentKey
        - opValue
        - amf
        - sqn
        - dnn
        - sst
      properties:
        mcc:
          type: string
          example: '208'
        mnc:
          type: string
          example: '93'
        msin:
          type: string
          example: '0000000001'
        permanentKey:
          type: string
          example: 8baf473f2f8fd09487cccbd7097c6862
        opValue:
          type: string
          example: 8e27b6af0e692e750f32667a3b14605d
        amf:
          type: string
          example: '8000'
        sqn:
          type: string
          example: '000000000023'
        dnn:
          type: string
          example: internet
        sst:
          type: string
          example: '1'
        sd:
          type: string
          example: '010203'
    DeployUeStatusResponse:
      type: object
      required:
        - instance
        - status
      properties:
        instance:
          type: string
          example: imsi-208930000000001
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
    DeployUeLogsResponse:
      type: object
      required:
        - instance
        - lines
      properties:
        instance:
          type: string
          example: imsi-208930000000001
        lines:
          type: array
          items:
            type: string
    DeployUeListResponse:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/DeployUeStatusResponse'
    ImageInfo:
      type: object
      required:
        - key
        - name
        - image
        - group
        - present
      properties:
        key:
          type: string
          example: amf
        name:
          type: string
          example: AMF
        image:
          type: string
          example: free5gc/amf:latest
        group:
          type: string
          example: free5gc
        present:
          type: boolean
          description: Whether the image is currently present in the local docker image cache.
        size:
          type: integer
          format: int64
          description: Image size in bytes. Omitted when not present locally.
        createdAt:
          type: string
          format: date-time
          description: When the locally cached image was built. Omitted when not present locally.
    ImageListResponse:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageInfo'