      summary: Check a gnb profile for conflicts with the saved ones
      description: The fields that must be unique are compared with every other saved profile (the one with the same id is skipped). Saving runs the same check and fails with 409 when it finds any.
      operationId: gnbProfileCheck
      security:
        - bearerAuth: []
      requestBody:
