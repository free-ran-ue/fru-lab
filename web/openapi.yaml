openapi: 3.0.3
info:
  title: full-stack-framework API
  description: Automatically generated OpenAPI spec from Postman collection "full-stack-framework"
  version: 1.0.0
servers:
  - url: http://127.0.0.1:5000
    description: Default local server
paths:
  /api/login:
    post:
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/logout:
    post:
      summary: Logout
      operationId: logout
      responses:
        '204':
          description: No Content

  /api/deploy/free5gc:
    post:
      summary: Deploy free5GC
      description: Deploys one of free5gc's compose templates (see RequestDeployFree5gc.template). Omitting the request body deploys "basic".
      operationId: deployFree5gcUp
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDeployFree5gc'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request - unknown template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop free5GC
      description: Fails with 409 if gNB is still running - gNB must be stopped first.
      operationId: deployFree5gcDown
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - gNB is still running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/free5gc/status:
    get:
      summary: Get free5GC deploy status
      operationId: deployFree5gcStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'

  /api/deploy/free5gc/logs:
    get:
      summary: Get free5GC container logs
      operationId: deployFree5gcLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LogService'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'

  /api/deploy/cores:
    get:
      summary: List the status of every free5GC core network
      description: One entry per core network of kind free5gc (the extra free5GC instances on this host). The lab's own free5GC stays under /api/deploy/free5gc.
      operationId: deployCoreList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployCoreListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/cores/{id}:
    post:
      summary: Deploy a free5GC core network
      description: Brings up the free5GC of core network id (kind free5gc) from a template on its own networks - a cn-ran network 10.0.(100+slot).0/24 with the AMF at .3 and the UPF at .5 (as the lab free5GC on 10.0.1.0/24), an internal SBI network, and its webconsole on host port deploy.webconsole.port + slot. 409 if it already runs or the core is not of kind free5gc.
      operationId: deployCoreUp
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: A core network of kind free5gc.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDeployFree5gc'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request - unknown template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: No such core network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop a free5GC core network
      description: 409 while a gNB attached to it runs.
      operationId: deployCoreDown
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: A core network of kind free5gc.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: No such core network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - a gNB on it still runs, or the core network is not of kind free5gc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/cores/{id}/logs:
    get:
      summary: Get the logs of a free5GC core network
      description: The live log stream is /api/stream/logs?target=core-<id> (service= narrows it to one NF).
      operationId: deployCoreLogs
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: A core network of kind free5gc.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'
        '404':
          description: No such core network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - the core network is not of kind free5gc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/gnbs:
    get:
      summary: List the gNBs deployed from gNB profiles
      description: One entry per gNB profile that has been deployed and not stopped since (a stopped one is removed).
      operationId: deployGnbList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployGnbListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/gnbs/{profileId}:
    post:
      summary: Deploy the gNB of one gNB profile
      description: Every gNB profile is one gNB; several run at once. Its ran-ue address (where UEs dial it) is picked by fru-lab. On the lab free5GC or a free5gc core network its N2/N3 address is assigned on deploy (the lowest free one from .20 up on that core's cn-ran network, shown in GnbDeployment.n2Ip); on an external core it is the profile's typed-in hostIp, which must be an address of the core's n2Interface (or of hostInterface for an external core given by address). Fails with 409 if it already runs, if its free5GC core (lab or free5gc core network) is not running, if its external core network is disabled or has no n2Interface, if the hostIp is missing or not on that interface, or if a running gNB already uses its gNB ID or host address.
      operationId: deployGnbUp
      security:
        - bearerAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployGnbRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: No such gNB profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop the gNB of one gNB profile
      description: Fails with 409 while a UE deployed onto this gNB still runs.
      operationId: deployGnbDown
      security:
        - bearerAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - a UE on this gNB still runs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/gnbs/{profileId}/logs:
    get:
      summary: Get the logs of one profile gNB
      operationId: deployGnbLogs
      security:
        - bearerAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/ue:
    get:
      summary: List all deployed UE instances
      operationId: deployUeList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeListResponse'

  /api/deploy/ue-profiles/{profileId}:
    post:
      summary: Deploy the UE of one UE profile
      description: Every UE profile is one UE (instance imsi-<mcc><mnc><msin>). gnb picks the gNB it attaches to; without it fru-lab picks a running gNB whose SD matches the profile's, else any running gNB. Fails with 409 if no gNB runs, the picked gNB does not run, or the UE already runs.
      operationId: deployUeProfileUp
      security:
        - bearerAuth: []
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployUeProfileRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: No such UE profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/ue/{instance}:
    post:
      summary: Deploy a UE instance for one subscriber
      description: Fails with 409 if gNB isn't running yet - deploy gNB first.
      operationId: deployUeUp
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployUeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - gNB isn't running yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop a UE instance
      operationId: deployUeDown
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/ue/{instance}/status:
    get:
      summary: Get a UE instance's deploy status
      operationId: deployUeStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeStatusResponse'

  /api/deploy/ue/{instance}/logs:
    get:
      summary: Get a UE instance's container logs
      operationId: deployUeLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeLogsResponse'

  /api/core-networks:
    get:
      summary: List the saved core networks
      description: 5G cores besides the lab free5GC that gNBs can attach to - external ones and free5gc ones fru-lab deploys on this host; the lab free5GC is not among them.
      operationId: coreNetworkList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoreNetwork'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    post:
      summary: Save a new core network
      description: Fails with 409 when the name (compared ignoring case) is the lab core's (free5GC) or another core network's, or (kind free5gc) when all 9 slots are taken.
      operationId: coreNetworkCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreNetwork'
      responses:
        '200':
          description: The saved core network, with its id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreNetwork'
        '400':
          description: Bad Request - a field is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - the name is taken, or every free5gc slot is
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/core-networks/{id}:
    put:
      summary: Update a core network
      description: The kind cannot change (400); a kind left out keeps the saved one. A free5gc core keeps its slot.
      operationId: coreNetworkUpdate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreNetwork'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreNetwork'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: No such core network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - the name is taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Delete a core network
      description: A free5gc core network cannot be deleted while it is deployed (409).
      operationId: coreNetworkDelete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - the free5gc core network is deployed; stop it first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/ipam:
    get:
      summary: The lab's address plan and who holds what
      description: Every address pool fru-lab manages (each core's cn-ran and SBI networks, the shared ran-ue network) with its reserved addresses, its dynamic ranges and its current leases, reconciled with Docker; plus any warning found (an address held outside fru-lab's leases, a host network overlapping a pool).
      operationId: ipamView
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpamView'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: The leases or the core networks could not be read from the database (Docker being unreachable is a warning, not an error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/host/interfaces:
    get:
      summary: List the host's network interfaces
      description: The interfaces with an IPv4 address an external-core gNB can listen on (loopback and Docker's own bridges and veths are left out).
      operationId: hostInterfaceList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HostInterface'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/profiles/gnb:
    get:
      summary: List the saved gNB profiles
      operationId: gnbProfileList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GnbProfile'
    post:
      summary: Save a new gNB profile
      operationId: gnbProfileCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GnbProfile'
      responses:
        '200':
          description: The saved profile, with its id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GnbProfile'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - a field that must be unique is used by another saved profile (see the check endpoint)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/profiles/gnb/check:
    post:
      summary: Check a gnb profile for conflicts with the saved ones
      description: The fields that must be unique are compared with every other saved profile (the one with the same id is skipped). Saving runs the same check and fails with 409 when it finds any.
      operationId: gnbProfileCheck
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GnbProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileCheckResult'
        '400':
          description: Bad Request - a field is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/profiles/gnb/bulk:
    post:
      summary: Create several gnb profiles from one
      description: Copies the source profile count times; the fields that must be unique count up to the next free value (gNB ID and N2 IP; lab core only). Names get a -2, -3, ... suffix.
      operationId: gnbProfileBulkCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileBulkRequest'
      responses:
        '200':
          description: The created profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GnbProfile'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: No such source profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/profiles/gnb/render:
    post:
      summary: Preview the config file a gNB profile deploys
      operationId: gnbProfileRender
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GnbProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderedConfig'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/profiles/gnb/{id}:
    put:
      summary: Update a gNB profile
      operationId: gnbProfileUpdate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GnbProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GnbProfile'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - a field that must be unique is used by another saved profile (see the check endpoint)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Delete a gNB profile
      operationId: gnbProfileDelete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/profiles/ue:
    get:
      summary: List the saved UE profiles
      operationId: ueProfileList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UeProfile'
    post:
      summary: Save a new UE profile
      operationId: ueProfileCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UeProfile'
      responses:
        '200':
          description: The saved profile, with its id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UeProfile'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - a field that must be unique is used by another saved profile (see the check endpoint)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/profiles/ue/check:
    post:
      summary: Check a ue profile for conflicts with the saved ones
      description: The fields that must be unique are compared with every other saved profile (the one with the same id is skipped). Saving runs the same check and fails with 409 when it finds any.
      operationId: ueProfileCheck
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UeProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileCheckResult'
        '400':
          description: Bad Request - a field is malformed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/profiles/ue/bulk:
    post:
      summary: Create several ue profiles from one
      description: Copies the source profile count times; the fields that must be unique count up to the next free value (MSIN). Names get a -2, -3, ... suffix.
      operationId: ueProfileBulkCreate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileBulkRequest'
      responses:
        '200':
          description: The created profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UeProfile'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: No such source profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/profiles/ue/render:
    post:
      summary: Preview the config file a UE profile deploys
      operationId: ueProfileRender
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UeProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderedConfig'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/profiles/ue/{id}:
    put:
      summary: Update a UE profile
      operationId: ueProfileUpdate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UeProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UeProfile'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - a field that must be unique is used by another saved profile (see the check endpoint)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Delete a UE profile
      operationId: ueProfileDelete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/images:
    get:
      summary: List the images this app deploys
      description: Reports every image pinned by the compose templates (free5gc's NFs, mongo, and free-ran-ue), and whether each is currently present in the local docker image cache.
      operationId: imageList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'

  /api/images/{key}:
    delete:
      summary: Clear a locally cached image
      description: Removes the image from the local docker image cache, forcing the next deploy to pull it fresh. Fails if a container is currently using it.
      operationId: imageRemove
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown image key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/images/{key}/pull:
    post:
      summary: Pull an image
      description: Re-pulls the image's pinned tag from its registry.
      operationId: imagePull
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown image key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UeInstance:
      name: instance
      in: path
      required: true
      description: The subscriber's UE ID (IMSI), used as the UE instance identifier.
      schema:
        type: string
        example: imsi-208930000000001
    LogService:
      name: service
      in: query
      required: false
      description: Filter logs down to one compose service (NF), e.g. "amf". Omit for every service in the project.
      schema:
        type: string
        example: amf
    ImageKey:
      name: key
      in: path
      required: true
      description: The image's stable route key, as returned by GET /api/images (e.g. "amf", "mongo", "free-ran-ue").
      schema:
        type: string
        example: amf
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: '0000'
    LoginResponse:
      type: object
      required:
        - message
        - token
      properties:
        message:
          type: string
        token:
          type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    DeployStatusResponse:
      type: object
      required:
        - target
        - status
      properties:
        target:
          type: string
          example: free5gc
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
        gnb:
          $ref: '#/components/schemas/GnbDeployment'
    ServiceStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          example: amf
        status:
          type: string
          example: running
    DeployLogsResponse:
      type: object
      required:
        - target
        - lines
      properties:
        target:
          type: string
          example: free5gc
        lines:
          type: array
          items:
            type: string
          example:
            - 'amf         | [INFO] AMF started, PLMN 208/93, listening on N2'
    RequestDeployFree5gc:
      type: object
      properties:
        template:
          type: string
          description: Which free5gc compose template to deploy. Defaults to "basic" when omitted.
          enum:
            - basic
            - ulcl
          example: basic
    DeployUeRequest:
      type: object
      required:
        - mcc
        - mnc
        - msin
        - permanentKey
        - opValue
        - amf
        - sqn
        - dnn
        - sst
      properties:
        mcc:
          type: string
          example: '208'
        mnc:
          type: string
          example: '93'
        msin:
          type: string
          example: '0000000001'
        permanentKey:
          type: string
          example: 8baf473f2f8fd09487cccbd7097c6862
        opValue:
          type: string
          example: 8e27b6af0e692e750f32667a3b14605d
        amf:
          type: string
          example: '8000'
        sqn:
          type: string
          example: '000000000023'
        dnn:
          type: string
          example: internet
        sst:
          type: string
          example: '1'
        sd:
          type: string
          example: '010203'
    DeployUeStatusResponse:
      type: object
      required:
        - instance
        - status
      properties:
        instance:
          type: string
          example: imsi-208930000000001
        gnb:
          type: string
          description: The gNB target it was deployed onto (gnb-<profileId>); empty when unknown.
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
    DeployUeLogsResponse:
      type: object
      required:
        - instance
        - lines
      properties:
        instance:
          type: string
          example: imsi-208930000000001
        lines:
          type: array
          items:
            type: string
    DeployUeListResponse:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/DeployUeStatusResponse'
    ImageInfo:
      type: object
      required:
        - key
        - name
        - image
        - group
        - present
      properties:
        key:
          type: string
          example: amf
        name:
          type: string
          example: AMF
        image:
          type: string
          example: free5gc/amf:latest
        group:
          type: string
          example: free5gc
        present:
          type: boolean
          description: Whether the image is currently present in the local docker image cache.
        size:
          type: integer
          format: int64
          description: Image size in bytes. Omitted when not present locally.
        createdAt:
          type: string
          format: date-time
          description: When the locally cached image was built. Omitted when not present locally.
    ImageListResponse:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageInfo'
    GnbDeployment:
      type: object
      required: [profileName, core, amfIp]
      properties:
        profileId:
          type: string
        profileName:
          type: string
        core:
          type: string
          enum: [lab, external]
        amfIp:
          type: string
        hostIp:
          type: string
        hostInterface:
          type: string
        gnbId:
          type: string
        gnbName:
          type: string
        sd:
          type: string
        n2Ip:
          type: string
          description: Its N2/N3 address (cn-ran, or the host's address on an external core).
        ranIp:
          type: string
          description: Where UEs dial it (ran-ue), picked by fru-lab; the host address on an external core.
        coreNetwork:
          type: string
          description: The core network it attached to (a core network id); empty for the lab free5GC.
    RenderedConfig:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
    GnbProfile:
      type: object
      required: [name, gnbId, mcc, mnc, tac, sst, core]
      properties:
        id:
          type: string
        name:
          type: string
        gnbId:
          type: string
          example: '000314'
        gnbName:
          type: string
        mcc:
          type: string
        mnc:
          type: string
        tac:
          type: string
          example: '000001'
        sst:
          type: string
        sd:
          type: string
        core:
          type: string
          enum: [lab, external]
          description: lab dials the free5GC fru-lab deploys; external runs the gNB on the host network and dials amfIp / upfIp.
        amfIp:
          type: string
        amfPort:
          type: integer
        upfIp:
          type: string
        upfPort:
          type: integer
        n2Ip:
          type: string
          example: 10.0.1.20
          description: Ignored - on the lab free5GC or a free5gc core network the gNB's N2/N3 address is assigned on deploy (the lowest free one from .20 up on that core's cn-ran network) and shows in GnbDeployment.n2Ip.
        hostInterface:
          type: string
          example: eth0
          description: External core only - the host interface the gNB listens on (see /api/host/interfaces).
        hostIp:
          type: string
          description: External core only - the IPv4 address the gNB listens on, typed in; UEs dial it too. On a saved external core network it must be an address of that core's n2Interface (which becomes hostInterface). Unique among the external gNB profiles.
        radioRange:
          type: number
          minimum: 0
          maximum: 1000000
          example: 500
          description: The gNB's simulated radio reach in metres - where its signal falls to 1% (100% at the gNB, S(d) = 1 / (1 + 99 (d / radioRange)^2), inverse-square far out, never 0). Left out or 0 is unlimited - 100% everywhere. Only the UI's map uses it; the gNB itself is unaffected.
        coreNetwork:
          type: string
          description: A saved core network's id - the core this gNB deploys onto when a deploy names none. Kind free5gc - the gNB joins that core's cn-ran network (core stays lab, addresses assigned). Kind external - core is external, its N2 / N3 addresses become the AMF / UPF and its n2Interface the host interface; hostIp is typed in.
        logLevel:
          type: string
        updatedAt:
          type: string
          format: date-time
    UeProfile:
      type: object
      required: [name, mcc, mnc, msin, permanentKey, opValue, amf, sqn, sst]
      properties:
        id:
          type: string
        name:
          type: string
        mcc:
          type: string
        mnc:
          type: string
        msin:
          type: string
          description: 9 or 10 digits. The IMSI (mcc + mnc + msin) is unique among the UE profiles.
        permanentKey:
          type: string
        opValue:
          type: string
          description: OPc
        amf:
          type: string
        sqn:
          type: string
        dnn:
          type: string
        sst:
          type: string
        sd:
          type: string
        gnbProfileId:
          type: string
          description: The gNB profile this UE attaches to when a deploy names no gNB; empty picks a running gNB by SD.
        updatedAt:
          type: string
          format: date-time
    DeployGnbListResponse:
      type: object
      required: [instances]
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/GnbInstance'
    GnbInstance:
      type: object
      required: [instance, profileId, status, gnb]
      properties:
        instance:
          type: string
          description: The gNB target name, gnb-<profileId>; the log stream and UE deploys use it.
          example: gnb-3f2a9c1e5b7d
        profileId:
          type: string
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
        gnb:
          $ref: '#/components/schemas/GnbDeployment'
    DeployUeProfileRequest:
      type: object
      properties:
        gnb:
          type: string
          description: The gNB target to attach to (gnb-<profileId>); empty uses the UE profile's gnbProfileId, else lets fru-lab pick by SD; auto always lets fru-lab pick.
    ProfileCheckResult:
      type: object
      required: [conflicts]
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ProfileConflict'
    ProfileConflict:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: The JSON field name, e.g. gnbId, n2Ip, hostIp, name, msin.
        message:
          type: string
          example: gNB ID 000314 is used by profile Lab gNB
        suggestion:
          type: string
          description: The next free value, when there is one.
    ProfileBulkRequest:
      type: object
      required: [profileId, count]
      properties:
        profileId:
          type: string
          description: The source profile.
        count:
          type: integer
          minimum: 1
          maximum: 500
    HostInterface:
      type: object
      required: [name, addresses]
      properties:
        name:
          type: string
          example: eth0
        addresses:
          type: array
          items:
            type: string
          example: [192.168.1.20]
    CoreNetwork:
      type: object
      required: [name, dns]
      properties:
        id:
          type: string
        name:
          type: string
          description: Unique among the core networks (ignoring case) and not free5GC, the lab core's name. 1-32 letters, digits, spaces, dots, dashes, underscores.
          example: campus-core
        kind:
          type: string
          enum: [external, free5gc]
          default: external
          description: external is a core outside fru-lab (n2Ip / n3Ip / interfaces given); free5gc is another free5GC fru-lab deploys on this host, whose addresses fru-lab assigns (n2Ip, n3Ip, n2Interface, n3Interface, slot, webconsolePort are then read-only, filled in on save, and dns is always [internet]). The kind cannot change after the first save.
        slot:
          type: integer
          readOnly: true
          description: kind free5gc - 1 to 9, unique; picks its networks (cn-ran 10.0.(100+slot).0/24, SBI 10.0.(110+slot).0/24), its container name prefix and its webconsole port.
        webconsolePort:
          type: integer
          readOnly: true
          description: kind free5gc - the host port its webconsole is published on (deploy.webconsole.port + slot). The browser reaches it at /api/core-networks/{id}/webconsole/..., which proxies it like /api/webconsole does for the lab free5GC.
        n2Ip:
          type: string
          description: The AMF's N2 address. Required for kind external; assigned for kind free5gc (10.0.(100+slot).3).
          example: 192.168.10.5
        n2Interface:
          type: string
          description: The host interface that reaches n2Ip.
          example: eth0
        n3Ip:
          type: string
          description: The UPF's N3 address. Required for kind external; assigned for kind free5gc (10.0.(100+slot).5).
          example: 192.168.10.6
        n3Interface:
          type: string
          description: The host interface that reaches n3Ip.
          example: eth1
        dns:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CoreDn'
        enabled:
          type: boolean
          description: Switched on, the core counts as part of the lab and the Overview draws it.
        updatedAt:
          type: string
          format: date-time
    CoreDn:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The DNN, unique within the core.
          example: internet
        cidr:
          type: string
          description: The address range its UEs get, optional.
          example: 10.60.0.0/16
    DeployGnbRequest:
      type: object
      properties:
        core:
          type: string
          description: The core this deploy attaches to - empty keeps the profile's, lab is the lab free5GC, anything else an enabled external core network's id (its N2 / N3 addresses become the AMF and UPF; the gNB listens on the profile's typed-in hostIp on the core's N2 interface), or a running free5gc core network's id (the gNB joins its cn-ran network at an assigned address).
    DeployCoreListResponse:
      type: object
      required: [cores]
      properties:
        cores:
          type: array
          items:
            $ref: '#/components/schemas/CoreDeployStatus'
    CoreDeployStatus:
      type: object
      required: [coreId, status]
      properties:
        coreId:
          type: string
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
        template:
          type: string
          description: The template it runs (basic / ulcl); empty while stopped.
    IpamView:
      type: object
      required: [pools, warnings]
      properties:
        pools:
          type: array
          items:
            $ref: '#/components/schemas/IpamPool'
        warnings:
          type: array
          items:
            type: string
    IpamPool:
      type: object
      required: [id, network, subnet, purpose, reserved, ranges, leases]
      properties:
        id:
          type: string
          description: cn-ran (the lab free5GC's), cn-ran-<coreId>, sbi, sbi-<coreId>, ran-ue
          example: cn-ran
        network:
          type: string
          description: The Docker network it is.
          example: frulab-cn-ran
        subnet:
          type: string
          example: 10.0.1.0/24
        purpose:
          type: string
          example: N2 / N3 between the lab free5GC and its gNBs
        coreId:
          type: string
          description: The core network it belongs to; empty for the lab free5GC's and the shared ones.
        reserved:
          type: array
          items:
            $ref: '#/components/schemas/IpamReserved'
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/IpamRange'
        leases:
          type: array
          items:
            $ref: '#/components/schemas/IpamLease'
    IpamReserved:
      type: object
      required: [addr, role]
      properties:
        addr:
          type: string
          example: 10.0.1.3
        role:
          type: string
          description: gateway, amf, upf, i-upf, psa-upf, smf, nrf, ... (a core NF's fixed address)
          example: amf
    IpamRange:
      type: object
      required: [name, first, last]
      properties:
        name:
          type: string
          description: gnb-n2 (gNB N2/N3 addresses), gnb-ran (where UEs dial a gNB), docker (what Docker hands out itself, e.g. to UEs)
          example: gnb-n2
        first:
          type: string
        last:
          type: string
    IpamLease:
      type: object
      required: [addr, owner]
      properties:
        addr:
          type: string
          example: 10.0.1.20
        owner:
          type: string
          description: Who holds it - a deploy target (gnb-<profileId>, ue-<imsi>, core-<id>) with an optional /<role>.
          example: gnb-3f2a9c1e5b7d
        role:
          type: string
          example: n2
        since:
          type: string
          format: date-time
        live:
          type: boolean
          description: A running container holds it right now (false is a lease kept for a stopped owner so it gets the same address back).
