    put:
      summary: Update a UE profile
      operationId: ueProfileUpdate
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UeProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UeProfile'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - a field that must be unique is used by another saved profile (see the check endpoint)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Delete a UE profile
      operationId: ueProfileDelete
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
  /api/images:
    get:
      summary: List the images this app deploys
      description: Reports every image pinned by the compose templates (free5gc's NFs, mongo, and free-ran-ue), and whether each is currently present in the local docker image cache.
      operationId: imageList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'

  /api/images/{key}:
    delete:
      summary: Clear a locally cached image
      description: Removes the image from the local docker image cache, forcing the next deploy to pull it fresh. Fails if a container is currently using it.
      operationId: imageRemove
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown image key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/images/{key}/pull:
    post:
      summary: Pull an image
      description: Re-pulls the image's pinned tag from its registry.
      operationId: imagePull
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown image key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UeInstance:
      name: instance
      in: path
      required: true
      description: The subscriber's UE ID (IMSI), used as the UE instance identifier.
      schema:
        type: string
        example: imsi-208930000000001
    LogService:
      name: service
      in: query
      required: false
      description: Filter logs down to one compose service (NF), e.g. "amf". Omit for every service in the project.
      schema:
        type: string
        example: amf
    ImageKey:
      name: key
      in: path
      required: true
      description: The image's stable route key, as returned by GET /api/images (e.g. "amf", "mongo", "free-ran-ue").
      schema:
        type: string
        example: amf
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: '0000'
    LoginResponse:
      type: object
      required:
        - message
        - token
      properties:
        message:
          type: string
        token:
          type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    DeployStatusResponse:
      type: object
      required:
        - target
        - status
      properties:
        target:
          type: string
          example: free5gc
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
        gnb:
          $ref: '#/components/schemas/GnbDeployment'
    ServiceStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          example: amf
        status:
          type: string
          example: running
    DeployLogsResponse:
      type: object
      required:
        - target
        - lines
      properties:
        target:
          type: string
          example: free5gc
        lines:
          type: array
          items:
            type: string
          example:
            - 'amf         | [INFO] AMF started, PLMN 208/93, listening on N2'
    RequestDeployFree5gc:
      type: object
      properties:
        template:
          type: string
          description: Which free5gc compose template to deploy. Defaults to "basic" when omitted.
          enum:
            - basic
            - ulcl
          example: basic
    DeployUeRequest:
      type: object
      required:
        - mcc
        - mnc
        - msin
        - permanentKey
        - opValue
        - amf
        - sqn
        - dnn
        - sst
      properties:
        mcc:
          type: string
          example: '208'
        mnc:
          type: string
          example: '93'
        msin:
          type: string
          example: '0000000001'
        permanentKey:
          type: string
          example: 8baf473f2f8fd09487cccbd7097c6862
        opValue:
          type: string
          example: 8e27b6af0e692e750f32667a3b14605d
        amf:
          type: string
          example: '8000'
        sqn:
          type: string
          example: '000000000023'
        dnn:
          type: string
          example: internet
        sst:
          type: string
          example: '1'
        sd:
          type: string
          example: '010203'
    DeployUeStatusResponse:
      type: object
      required:
        - instance
        - status
      properties:
        instance:
          type: string
          example: imsi-208930000000001
        gnb:
          type: string
          description: The gNB target it was deployed onto (gnb-<profileId>); empty when unknown.
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
    DeployUeLogsResponse:
      type: object
      required:
        - instance
        - lines
      properties:
        instance:
          type: string
          example: imsi-208930000000001
        lines:
          type: array
          items:
            type: string
    DeployUeListResponse:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/DeployUeStatusResponse'
    ImageInfo:
      type: object
      required:
        - key
        - name
        - image
        - group
        - present
      properties:
        key:
          type: string
          example: amf
        name:
          type: string
          example: AMF
        image:
          type: string
          example: free5gc/amf:latest
        group:
          type: string
          example: free5gc
        present:
          type: boolean
          description: Whether the image is currently present in the local docker image cache.
        size:
          type: integer
          format: int64
          description: Image size in bytes. Omitted when not present locally.
        createdAt:
          type: string
          format: date-time
          description: When the locally cached image was built. Omitted when not present locally.
    ImageListResponse:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageInfo'
    GnbDeployment:
      type: object
      required: [profileName, core, amfIp]
      properties:
        profileId:
          type: string
        profileName:
          type: string
        core:
          type: string
          enum: [lab, external]
        amfIp:
          type: string
        hostIp:
          type: string
        hostInterface:
          type: string
        gnbId:
          type: string
        gnbName:
          type: string
        sd:
          type: string
        n2Ip:
          type: string
          description: Its N2/N3 address (cn-ran, or the host's address on an external core).
        ranIp:
          type: string
          description: Where UEs dial it (ran-ue), picked by fru-lab; the host address on an external core.
    RenderedConfig:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
    GnbProfile:
      type: object
      required: [name, gnbId, mcc, mnc, tac, sst, core]
      properties:
        id:
          type: string
        name:
          type: string
        gnbId:
          type: string
          example: '000314'
        gnbName:
          type: string
        mcc:
          type: string
        mnc:
          type: string
        tac:
          type: string
          example: '000001'
        sst:
          type: string
        sd:
          type: string
        core:
          type: string
          enum: [lab, external]
          description: lab dials the free5GC fru-lab deploys; external runs the gNB on the host network and dials amfIp / upfIp.
        amfIp:
          type: string
        amfPort:
          type: integer
        upfIp:
          type: string
        upfPort:
          type: integer
        n2Ip:
          type: string
          example: 10.0.1.20
          description: Lab core only - the gNB's N2/N3 address on the lab's cn-ran network (10.0.1.20 - 10.0.1.254; lower ones are the core's). Unique among the gNB profiles.
        hostInterface:
          type: string
          example: eth0
          description: External core only - the host interface the gNB listens on (see /api/host/interfaces).
        hostIp:
          type: string
          description: External core only - the IPv4 address of hostInterface the gNB listens on; UEs dial it too. Unique among the external gNB profiles.
        coreNetwork:
          type: string
          description: External core only - a saved core network's id. Its N2 / N3 addresses become the AMF / UPF on deploy (amfIp / upfIp are then left empty), and hostInterface may be left empty for the core's N2 interface. Deploys without a core of their own go there.
        logLevel:
          type: string
        updatedAt:
          type: string
          format: date-time
    UeProfile:
      type: object
      required: [name, mcc, mnc, msin, permanentKey, opValue, amf, sqn, sst]
      properties:
        id:
          type: string
        name:
          type: string
        mcc:
          type: string
        mnc:
          type: string
        msin:
          type: string
          description: 9 or 10 digits. The IMSI (mcc + mnc + msin) is unique among the UE profiles.
        permanentKey:
          type: string
        opValue:
          type: string
          description: OPc
        amf:
          type: string
        sqn:
          type: string
        dnn:
          type: string
        sst:
          type: string
        sd:
          type: string
        gnbProfileId:
          type: string
          description: The gNB profile this UE attaches to when a deploy names no gNB; empty picks a running gNB by SD.
        updatedAt:
          type: string
          format: date-time
    DeployGnbListResponse:
      type: object
      required: [instances]
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/GnbInstance'
    GnbInstance:
      type: object
      required: [instance, profileId, status, gnb]
      properties:
        instance:
          type: string
          description: The gNB target name, gnb-<profileId>; the log stream and UE deploys use it.
          example: gnb-3f2a9c1e5b7d
        profileId:
          type: string
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
        gnb:
          $ref: '#/components/schemas/GnbDeployment'
    DeployUeProfileRequest:
      type: object
      properties:
        gnb:
          type: string
          description: The gNB target to attach to (gnb-<profileId>); empty uses the UE profile's gnbProfileId, else lets fru-lab pick by SD; auto always lets fru-lab pick.
    ProfileCheckResult:
      type: object
      required: [conflicts]
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ProfileConflict'
    ProfileConflict:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: The JSON field name, e.g. gnbId, n2Ip, hostIp, name, msin.
        message:
          type: string
          example: gNB ID 000314 is used by profile Lab gNB
        suggestion:
          type: string
          description: The next free value, when there is one.
    ProfileBulkRequest:
      type: object
      required: [profileId, count]
      properties:
        profileId:
          type: string
          description: The source profile.
        count:
          type: integer
          minimum: 1
          maximum: 500
    HostInterface:
      type: object
      required: [name, addresses]
      properties:
        name:
          type: string
          example: eth0
        addresses:
          type: array
          items:
            type: string
          example: [192.168.1.20]
    CoreNetwork:
      type: object
      required: [name, n2Ip, n3Ip, dns]
      properties:
        id:
          type: string
        name:
          type: string
          description: Unique among the core networks (ignoring case) and not free5GC, the lab core's name. 1-32 letters, digits, spaces, dots, dashes, underscores.
          example: campus-core
        n2Ip:
          type: string
          description: The AMF's N2 address.
          example: 192.168.10.5
        n2Interface:
          type: string
          description: The host interface that reaches n2Ip.
          example: eth0
        n3Ip:
          type: string
          description: The UPF's N3 address.
          example: 192.168.10.6
        n3Interface:
          type: string
          description: The host interface that reaches n3Ip.
          example: eth1
        dns:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CoreDn'
        enabled:
          type: boolean
          description: Switched on, the core counts as part of the lab and the Overview draws it.
        updatedAt:
          type: string
          format: date-time
    CoreDn:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The DNN, unique within the core.
          example: internet
        cidr:
          type: string
          description: The address range its UEs get, optional.
          example: 10.60.0.0/16
    DeployGnbRequest:
      type: object
      properties:
        core:
          type: string
          description: The core this deploy attaches to - empty keeps the profile's, lab is the lab free5GC, anything else an enabled core network's id (its N2 / N3 addresses become the AMF and UPF; the gNB listens on the profile's host interface, else the core's N2 interface).
