components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UeInstance:
      name: instance
      in: path
      required: true
      description: The subscriber's UE ID (IMSI), used as the UE instance identifier.
      schema:
        type: string
        example: imsi-208930000000001
    LogService:
      name: service
      in: query
      required: false
      description: Filter logs down to one compose service (NF), e.g. "amf". Omit for every service in the project.
      schema:
        type: string
        example: amf
    ImageKey:
      name: key
      in: path
      required: true
      description: The image's stable route key, as returned by GET /api/images (e.g. "amf", "mongo", "free-ran-ue").
      schema:
        type: string
        example: amf
    GnbSlice:
      name: slice
      in: path
      required: true
      description: Which ulcl-2slice slice's gNB to act on.
      schema:
        type: string
        enum:
          - slice1
          - slice2
        example: slice1
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: '0000'
    LoginResponse:
      type: object
      required:
        - message
        - token
      properties:
        message:
          type: string
        token:
          type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    DeployStatusResponse:
      type: object
      required:
        - target
        - status
      properties:
        target:
          type: string
          example: free5gc
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
        gnb:
          $ref: '#/components/schemas/GnbDeployment'
    ServiceStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          example: amf
        status:
          type: string
          example: running
    DeployLogsResponse:
      type: object
      required:
        - target
        - lines
      properties:
        target:
          type: string
          example: free5gc
        lines:
          type: array
          items:
            type: string
          example:
            - 'amf         | [INFO] AMF started, PLMN 208/93, listening on N2'
    RequestDeployFree5gc:
      type: object
      properties:
        template:
          type: string
          description: Which free5gc compose template to deploy. Defaults to "basic" when omitted.
          enum:
            - basic
            - ulcl
            - ulcl-2slice
          example: basic
    DeployUeRequest:
      type: object
      required:
        - mcc
        - mnc
        - msin
        - permanentKey
        - opValue
        - amf
        - sqn
        - dnn
        - sst
      properties:
        mcc:
          type: string
          example: '208'
        mnc:
          type: string
          example: '93'
        msin:
          type: string
          example: '0000000001'
        permanentKey:
          type: string
          example: 8baf473f2f8fd09487cccbd7097c6862
        opValue:
          type: string
          example: 8e27b6af0e692e750f32667a3b14605d
        amf:
          type: string
          example: '8000'
        sqn:
          type: string
          example: '000000000023'
        dnn:
          type: string
          example: internet
        sst:
          type: string
          example: '1'
        sd:
          type: string
          example: '010203'
    DeployUeStatusResponse:
      type: object
      required:
        - instance
        - status
      properties:
        instance:
          type: string
          example: imsi-208930000000001
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
    DeployUeLogsResponse:
      type: object
      required:
        - instance
        - lines
      properties:
        instance:
          type: string
          example: imsi-208930000000001
        lines:
          type: array
          items:
            type: string
    DeployUeListResponse:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/DeployUeStatusResponse'
    ImageInfo:
      type: object
      required:
        - key
        - name
        - image
        - group
        - present
      properties:
        key:
          type: string
          example: amf
        name:
          type: string
          example: AMF
        image:
          type: string
          example: free5gc/amf:latest
        group:
          type: string
          example: free5gc
        present:
          type: boolean
          description: Whether the image is currently present in the local docker image cache.
        size:
          type: integer
          format: int64
          description: Image size in bytes. Omitted when not present locally.
        createdAt:
          type: string
          format: date-time
          description: When the locally cached image was built. Omitted when not present locally.
    ImageListResponse:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageInfo'
    DeployGnbRequest:
      type: object
      properties:
        profileId:
          type: string
          description: A saved gNB profile; empty deploys the lab default.
    GnbDeployment:
      type: object
      required: [profileName, core, amfIp]
      properties:
        profileId:
          type: string
        profileName:
          type: string
        core:
          type: string
          enum: [lab, external]
        amfIp:
          type: string
        hostIp:
          type: string
    RenderedConfig:
      type: object
      required: [yaml]
      properties:
        yaml:
          type: string
    GnbProfile:
      type: object
      required: [name, gnbId, mcc, mnc, tac, sst, core]
      properties:
        id:
          type: string
        name:
          type: string
        gnbId:
          type: string
          example: '000314'
        gnbName:
          type: string
        mcc:
          type: string
        mnc:
          type: string
        tac:
          type: string
          example: '000001'
        sst:
          type: string
        sd:
          type: string
        core:
          type: string
          enum: [lab, external]
          description: lab dials the free5GC fru-lab deploys; external runs the gNB on the host network and dials amfIp / upfIp.
        amfIp:
          type: string
        amfPort:
          type: integer
        upfIp:
          type: string
        upfPort:
          type: integer
        hostIp:
          type: string
          description: The host address the gNB listens on (external core); UEs dial it too.
        logLevel:
          type: string
        updatedAt:
          type: string
          format: date-time
    UeProfile:
      type: object
      required: [name, mcc, mnc, msinStart, count, permanentKey, opValue, amf, sqn, sst]
      properties:
        id:
          type: string
        name:
          type: string
        mcc:
          type: string
        mnc:
          type: string
        msinStart:
          type: string
          description: The first UE's MSIN; the others count up from it.
        count:
          type: integer
          minimum: 1
          maximum: 500
        permanentKey:
          type: string
        opValue:
          type: string
          description: OPc
        amf:
          type: string
        sqn:
          type: string
        dnn:
          type: string
        sst:
          type: string
        sd:
          type: string
        updatedAt:
          type: string
          format: date-time
