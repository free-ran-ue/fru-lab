openapi: 3.0.3
info:
  title: full-stack-framework API
  description: Automatically generated OpenAPI spec from Postman collection "full-stack-framework"
  version: 1.0.0
servers:
  - url: http://127.0.0.1:5000
    description: Default local server
paths:
  /api/login:
    post:
      summary: Login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/logout:
    post:
      summary: Logout
      operationId: logout
      responses:
        '204':
          description: No Content

  /api/deploy/free5gc:
    post:
      summary: Deploy free5GC
      description: Deploys one of free5gc's compose templates (see RequestDeployFree5gc.template). Omitting the request body deploys "basic".
      operationId: deployFree5gcUp
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDeployFree5gc'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request - unknown template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop free5GC
      description: Fails with 409 if gNB is still running - gNB must be stopped first.
      operationId: deployFree5gcDown
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - gNB is still running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/free5gc/status:
    get:
      summary: Get free5GC deploy status
      operationId: deployFree5gcStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'

  /api/deploy/free5gc/logs:
    get:
      summary: Get free5GC container logs
      operationId: deployFree5gcLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LogService'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'

  /api/deploy/gnb:
    post:
      summary: Deploy gNB
      description: Fails with 409 if the core network isn't running yet - deploy free5gc first. This is the singleton gNB used by the basic/ulcl free5gc templates - see /api/deploy/gnb-slice/{slice} for ulcl-2slice.
      operationId: deployGnbUp
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - the core network isn't running yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop gNB
      description: Fails with 409 if any UE instance is still running - all UE instances must be stopped first.
      operationId: deployGnbDown
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - a UE instance is still running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/gnb/status:
    get:
      summary: Get gNB deploy status
      operationId: deployGnbStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'

  /api/deploy/gnb/logs:
    get:
      summary: Get gNB container logs
      operationId: deployGnbLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LogService'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'

  /api/deploy/gnb-slice/{slice}:
    post:
      summary: Deploy a gNB slice (ulcl-2slice only)
      description: Deploys the gNB dedicated to one slice of the ulcl-2slice free5gc template. Unlike /api/deploy/gnb, gnb-slice1 and gnb-slice2 are independent and can both be deployed at the same time. Fails with 409 if the core network isn't running yet.
      operationId: deployGnbSliceUp
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GnbSlice'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown slice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - the core network isn't running yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop a gNB slice (ulcl-2slice only)
      description: Fails with 409 if any UE instance is still running - all UE instances must be stopped first.
      operationId: deployGnbSliceDown
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GnbSlice'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown slice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - a UE instance is still running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/gnb-slice/{slice}/status:
    get:
      summary: Get a gNB slice's deploy status
      operationId: deployGnbSliceStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GnbSlice'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown slice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployStatusResponse'

  /api/deploy/gnb-slice/{slice}/logs:
    get:
      summary: Get a gNB slice's container logs
      operationId: deployGnbSliceLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/GnbSlice'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown slice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployLogsResponse'

  /api/deploy/ue:
    get:
      summary: List all deployed UE instances
      operationId: deployUeList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeListResponse'

  /api/deploy/ue/{instance}:
    post:
      summary: Deploy a UE instance for one subscriber
      description: Fails with 409 if gNB isn't running yet - deploy gNB first.
      operationId: deployUeUp
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeployUeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '409':
          description: Conflict - gNB isn't running yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      summary: Stop a UE instance
      operationId: deployUeDown
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/deploy/ue/{instance}/status:
    get:
      summary: Get a UE instance's deploy status
      operationId: deployUeStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeStatusResponse'

  /api/deploy/ue/{instance}/logs:
    get:
      summary: Get a UE instance's container logs
      operationId: deployUeLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UeInstance'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeLogsResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployUeLogsResponse'

  /api/images:
    get:
      summary: List the images this app deploys
      description: Reports every image pinned by the compose templates (free5gc's NFs, mongo, and free-ran-ue), and whether each is currently present in the local docker image cache.
      operationId: imageList
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageListResponse'

  /api/images/{key}:
    delete:
      summary: Clear a locally cached image
      description: Removes the image from the local docker image cache, forcing the next deploy to pull it fresh. Fails if a container is currently using it.
      operationId: imageRemove
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown image key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/images/{key}/pull:
    post:
      summary: Pull an image
      description: Re-pulls the image's pinned tag from its registry.
      operationId: imagePull
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImageKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Not Found - unknown image key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/tester/profile:
    get:
      summary: Get the saved Throughput Tester profile
      description: Returns the last profile saved from the setup page. 204 when none has been saved yet.
      operationId: testerProfileGet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterProfile'
        '204':
          description: No profile saved yet
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    put:
      summary: Save the Throughput Tester profile
      description: Stores the profile as-is. Field validation is done by POST /api/tester/profile/validate, not here.
      operationId: testerProfilePut
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TesterProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Body is not a JSON object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/tester/profile/validate:
    post:
      summary: Validate a profile and preview the per-gNB plan
      description: Forwarded to fru-tester. Always 200 for a well-formed body; `valid` says whether the profile can start a run.
      operationId: testerProfileValidate
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TesterProfile'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterValidateResponse'
        '502':
          description: fru-tester is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '503':
          description: backend.tester.url is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/tester/run:
    get:
      summary: Current run snapshot
      description: Forwarded to fru-tester. State is `idle` before the first run.
      operationId: testerRunGet
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterRunSnapshot'
        '502':
          description: fru-tester is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '503':
          description: backend.tester.url is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    post:
      summary: Start a run
      description: Forwarded to fru-tester. Only one run may be active at a time.
      operationId: testerRunStart
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TesterProfile'
      responses:
        '202':
          description: Run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterRunSnapshot'
        '400':
          description: Profile is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterStartErrorResponse'
        '409':
          description: A run is already active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '502':
          description: fru-tester is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '503':
          description: backend.tester.url is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'

  /api/tester/run/stop:
    post:
      summary: Stop the active run
      description: Closes every N2 association and removes the gNB IPs fru-tester added. Returns at once; watch the stream for `stopped`.
      operationId: testerRunStop
      security:
        - bearerAuth: []
      responses:
        '202':
          description: Stop requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TesterRunSnapshot'
        '409':
          description: No active run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UeInstance:
      name: instance
      in: path
      required: true
      description: The subscriber's UE ID (IMSI), used as the UE instance identifier.
      schema:
        type: string
        example: imsi-208930000000001
    LogService:
      name: service
      in: query
      required: false
      description: Filter logs down to one compose service (NF), e.g. "amf". Omit for every service in the project.
      schema:
        type: string
        example: amf
    ImageKey:
      name: key
      in: path
      required: true
      description: The image's stable route key, as returned by GET /api/images (e.g. "amf", "mongo", "free-ran-ue").
      schema:
        type: string
        example: amf
    GnbSlice:
      name: slice
      in: path
      required: true
      description: Which ulcl-2slice slice's gNB to act on.
      schema:
        type: string
        enum:
          - slice1
          - slice2
        example: slice1
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: '0000'
    LoginResponse:
      type: object
      required:
        - message
        - token
      properties:
        message:
          type: string
        token:
          type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    DeployStatusResponse:
      type: object
      required:
        - target
        - status
      properties:
        target:
          type: string
          example: free5gc
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
    ServiceStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          example: amf
        status:
          type: string
          example: running
    DeployLogsResponse:
      type: object
      required:
        - target
        - lines
      properties:
        target:
          type: string
          example: free5gc
        lines:
          type: array
          items:
            type: string
          example:
            - 'amf         | [INFO] AMF started, PLMN 208/93, listening on N2'
    RequestDeployFree5gc:
      type: object
      properties:
        template:
          type: string
          description: Which free5gc compose template to deploy. Defaults to "basic" when omitted.
          enum:
            - basic
            - ulcl
            - ulcl-2slice
          example: basic
    DeployUeRequest:
      type: object
      required:
        - mcc
        - mnc
        - msin
        - permanentKey
        - opValue
        - amf
        - sqn
        - dnn
        - sst
      properties:
        mcc:
          type: string
          example: '208'
        mnc:
          type: string
          example: '93'
        msin:
          type: string
          example: '0000000001'
        permanentKey:
          type: string
          example: 8baf473f2f8fd09487cccbd7097c6862
        opValue:
          type: string
          example: 8e27b6af0e692e750f32667a3b14605d
        amf:
          type: string
          example: '8000'
        sqn:
          type: string
          example: '000000000023'
        dnn:
          type: string
          example: internet
        sst:
          type: string
          example: '1'
        sd:
          type: string
          example: '010203'
    DeployUeStatusResponse:
      type: object
      required:
        - instance
        - status
      properties:
        instance:
          type: string
          example: imsi-208930000000001
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
    DeployUeLogsResponse:
      type: object
      required:
        - instance
        - lines
      properties:
        instance:
          type: string
          example: imsi-208930000000001
        lines:
          type: array
          items:
            type: string
    DeployUeListResponse:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/DeployUeStatusResponse'
    ImageInfo:
      type: object
      required:
        - key
        - name
        - image
        - group
        - present
      properties:
        key:
          type: string
          example: amf
        name:
          type: string
          example: AMF
        image:
          type: string
          example: free5gc/amf:latest
        group:
          type: string
          example: free5gc
        present:
          type: boolean
          description: Whether the image is currently present in the local docker image cache.
        size:
          type: integer
          format: int64
          description: Image size in bytes. Omitted when not present locally.
        createdAt:
          type: string
          format: date-time
          description: When the locally cached image was built. Omitted when not present locally.
    ImageListResponse:
      type: object
      properties:
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageInfo'
    TesterProfile:
      type: object
      required: [name, scale, gnb, network, rates]
      properties:
        name:
          type: string
          example: 1000 UE baseline
        scale:
          type: object
          required: [gnbCount, ueCount]
          properties:
            gnbCount:
              type: integer
              example: 10
            ueCount:
              type: integer
              example: 1000
        gnb:
          type: object
          required: [gnbIdStart, namePattern, mcc, mnc, tac, sst, sd]
          properties:
            gnbIdStart:
              type: string
              description: 6 or 8 hex digits; incremented per gNB, keeping its width.
              example: '000314'
            namePattern:
              type: string
              description: Must contain {i}, replaced by the 1-based gNB index.
              example: gNB-{i}
            mcc:
              type: string
              example: '208'
            mnc:
              type: string
              example: '93'
            tac:
              type: string
              example: '000001'
            sst:
              type: integer
              example: 1
            sd:
              type: string
              description: Empty or 6 hex digits.
              example: '010203'
        network:
          type: object
          required: [n2, n3]
          properties:
            n2:
              type: object
              required: [interface, cidr, startIp, amfIp, amfPort]
              properties:
                interface:
                  type: string
                  example: ens19
                cidr:
                  type: string
                  example: 10.0.1.0/24
                startIp:
                  type: string
                  example: 10.0.1.100
                amfIp:
                  type: string
                  example: 10.0.1.1
                amfPort:
                  type: integer
                  example: 38412
            n3:
              type: object
              required: [interface, cidr, startIp, upfIp, upfPort]
              properties:
                interface:
                  type: string
                  example: ens20
                cidr:
                  type: string
                  example: 10.0.2.0/24
                startIp:
                  type: string
                  example: 10.0.2.100
                upfIp:
                  type: string
                  example: 10.0.2.1
                upfPort:
                  type: integer
                  example: 2152
        rates:
          type: object
          required: [n2]
          properties:
            n2:
              $ref: '#/components/schemas/TesterStageRate'
    TesterStageRate:
      type: object
      required: [timeoutMs, retries]
      properties:
        timeoutMs:
          type: integer
          example: 5000
        retries:
          type: integer
          example: 1
    TesterFieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          example: network.n2.cidr
        message:
          type: string
    TesterGnbSpec:
      type: object
      required: [index, name, gnbId, n2Ip, n3Ip, ueCount, ueFirst, ueLast]
      properties:
        index:
          type: integer
        name:
          type: string
        gnbId:
          type: string
        n2Ip:
          type: string
        n3Ip:
          type: string
        ueCount:
          type: integer
        ueFirst:
          type: integer
          description: 1-based index of the first UE on this gNB; 0 when it has none.
        ueLast:
          type: integer
    TesterPlan:
      type: object
      required: [gnbs, uesPerGnb, n2Prefix, n3Prefix]
      properties:
        gnbs:
          type: array
          items:
            $ref: '#/components/schemas/TesterGnbSpec'
        uesPerGnb:
          type: integer
        n2Prefix:
          type: integer
        n3Prefix:
          type: integer
    TesterValidateResponse:
      type: object
      required: [valid, errors]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TesterFieldError'
        plan:
          allOf:
            - $ref: '#/components/schemas/TesterPlan'
          nullable: true
    TesterStartErrorResponse:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/TesterFieldError'
    TesterCauseCount:
      type: object
      required: [cause, count]
      properties:
        cause:
          type: string
          example: misc(4)
        count:
          type: integer
          format: int64
    TesterStageSnapshot:
      type: object
      description: One stage card. Latencies are milliseconds over accepted items only; totalTimeMs is first start to last finish.
      required: [name, expected, attempted, retries, inFlight, accepted, rejected, timedOut, failed, done, totalTimeMs, avgMs, p50Ms, p95Ms, p99Ms, maxMs, causes]
      properties:
        name:
          type: string
        expected:
          type: integer
        attempted:
          type: integer
          format: int64
        retries:
          type: integer
          format: int64
        inFlight:
          type: integer
          format: int64
        accepted:
          type: integer
          format: int64
        rejected:
          type: integer
          format: int64
        timedOut:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        done:
          type: boolean
        totalTimeMs:
          type: number
        avgMs:
          type: number
        p50Ms:
          type: number
        p95Ms:
          type: number
        p99Ms:
          type: number
        maxMs:
          type: number
        causes:
          type: array
          items:
            $ref: '#/components/schemas/TesterCauseCount'
    TesterGnbStatus:
      allOf:
        - $ref: '#/components/schemas/TesterGnbSpec'
        - type: object
          required: [state, attempts, latencyMs, cause]
          properties:
            state:
              type: string
              enum: [pending, connecting, up, failed, lost, closed]
              description: lost = was up, then the AMF side dropped the association.
            attempts:
              type: integer
            latencyMs:
              type: number
            cause:
              type: string
    TesterRunSnapshot:
      type: object
      required: [runId, profileName, state, error, n2, gnbs]
      properties:
        runId:
          type: string
        profileName:
          type: string
        state:
          type: string
          enum: [idle, configuring, n2, running, stopping, stopped, failed]
        error:
          type: string
        startedAt:
          type: string
          format: date-time
          nullable: true
        stoppedAt:
          type: string
          format: date-time
          nullable: true
        n2:
          $ref: '#/components/schemas/TesterStageSnapshot'
        gnbs:
          type: array
          items:
            $ref: '#/components/schemas/TesterGnbStatus'
