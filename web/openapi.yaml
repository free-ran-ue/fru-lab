components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UeInstance:
      name: instance
      in: path
      required: true
      description: The subscriber's UE ID (IMSI), used as the UE instance identifier.
      schema:
        type: string
        example: imsi-208930000000001
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          example: '0000'
    LoginResponse:
      type: object
      required:
        - message
        - token
      properties:
        message:
          type: string
        token:
          type: string
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    DeployStatusResponse:
      type: object
      required:
        - target
        - status
      properties:
        target:
          type: string
          example: free5gc
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
    ServiceStatus:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          example: amf
        status:
          type: string
          example: running
    DeployLogsResponse:
      type: object
      required:
        - target
        - lines
      properties:
        target:
          type: string
          example: free5gc
        lines:
          type: array
          items:
            type: string
          example:
            - 'amf         | [INFO] AMF started, PLMN 208/93, listening on N2'
    DeployUeRequest:
      type: object
      required:
        - mcc
        - mnc
        - msin
        - permanentKey
        - opValue
        - amf
        - sqn
        - dnn
        - sst
      properties:
        mcc:
          type: string
          example: '208'
        mnc:
          type: string
          example: '93'
        msin:
          type: string
          example: '0000000001'
        permanentKey:
          type: string
          example: 8baf473f2f8fd09487cccbd7097c6862
        opValue:
          type: string
          example: 8e27b6af0e692e750f32667a3b14605d
        amf:
          type: string
          example: '8000'
        sqn:
          type: string
          example: '000000000023'
        dnn:
          type: string
          example: internet
        sst:
          type: string
          example: '1'
        sd:
          type: string
          example: '010203'
    DeployUeStatusResponse:
      type: object
      required:
        - instance
        - status
      properties:
        instance:
          type: string
          example: imsi-208930000000001
        status:
          type: string
          example: running
        services:
          type: array
          items:
            $ref: '#/components/schemas/ServiceStatus'
        lastDeployed:
          type: string
          format: date-time
    DeployUeLogsResponse:
      type: object
      required:
        - instance
        - lines
      properties:
        instance:
          type: string
          example: imsi-208930000000001
        lines:
          type: array
          items:
            type: string
    DeployUeListResponse:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/DeployUeStatusResponse'