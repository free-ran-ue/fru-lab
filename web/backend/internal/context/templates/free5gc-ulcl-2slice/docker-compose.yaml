services:
  db:
    container_name: mongodb
    image: mongo:4.4
    command: mongod --port 27017
    expose:
      - "27017"
    volumes:
      - dbdata:/data/db
    networks:
      sbi:
        aliases:
          - db.free5gc.org

  amf:
    container_name: amf
    image: free5gc/amf:latest
    command: ./amf -c ./config/amfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/amfcfg.yaml:/free5gc/config/amfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - amf.free5gc.org
      # shared with the free-ran-ue target's gnb service; must already exist
      # (created once by the backend, not owned by this compose project)
      cn-ran:
        ipv4_address: 10.0.1.3
        aliases:
          - n2.free5gc.org
    depends_on:
      - nrf

  ausf:
    container_name: ausf
    image: free5gc/ausf:latest
    command: ./ausf -c ./config/ausfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/ausfcfg.yaml:/free5gc/config/ausfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - ausf.free5gc.org
    depends_on:
      - nrf

  chf:
    container_name: chf
    image: free5gc/chf:latest
    command: ./chf -c ./config/chfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/chfcfg.yaml:/free5gc/config/chfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - chf.free5gc.org
    depends_on:
      - db
      - nrf
      - webconsole

  nrf:
    container_name: nrf
    image: free5gc/nrf:latest
    command: ./nrf -c ./config/nrfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/nrfcfg.yaml:/free5gc/config/nrfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - nrf.free5gc.org
    depends_on:
      - db

  nssf:
    container_name: nssf
    image: free5gc/nssf:latest
    command: ./nssf -c ./config/nssfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/nssfcfg.yaml:/free5gc/config/nssfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - nssf.free5gc.org
    depends_on:
      - nrf

  pcf:
    container_name: pcf
    image: free5gc/pcf:latest
    command: ./pcf -c ./config/pcfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/pcfcfg.yaml:/free5gc/config/pcfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - pcf.free5gc.org
    depends_on:
      - nrf

  # One dedicated SMF per slice (rather than one shared SMF with both gNBs
  # in its topology) - see smf1cfg.yaml's comment for why: AMF picks the
  # serving SMF per PDU session via NRF discovery filtered by S-NSSAI, so as
  # long as each SMF only registers its own slice, sessions always land on
  # the right one, and each SMF's topology only ever has its own single AN
  # node (no ambiguity for free5gc's default-path computation to get wrong).
  smf1:
    container_name: smf1
    image: free5gc/smf:latest
    command: ./smf -c ./config/smfcfg.yaml -u ./config/uerouting.yaml
    expose:
      - "8000"
    volumes:
      - ./config/smf1cfg.yaml:/free5gc/config/smfcfg.yaml
      - ./config/uerouting.yaml:/free5gc/config/uerouting.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - smf1.free5gc.org
    depends_on:
      - nrf
      - i-upf-1
      - psa-upf-1

  smf2:
    container_name: smf2
    image: free5gc/smf:latest
    command: ./smf -c ./config/smfcfg.yaml -u ./config/uerouting.yaml
    expose:
      - "8000"
    volumes:
      - ./config/smf2cfg.yaml:/free5gc/config/smfcfg.yaml
      - ./config/uerouting.yaml:/free5gc/config/uerouting.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - smf2.free5gc.org
    depends_on:
      - nrf
      - i-upf-2
      - psa-upf-2

  udm:
    container_name: udm
    image: free5gc/udm:latest
    command: ./udm -c ./config/udmcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/udmcfg.yaml:/free5gc/config/udmcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - udm.free5gc.org
    depends_on:
      - db
      - nrf

  udr:
    container_name: udr
    image: free5gc/udr:latest
    command: ./udr -c ./config/udrcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/udrcfg.yaml:/free5gc/config/udrcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - udr.free5gc.org
    depends_on:
      - db
      - nrf

  # Slice 1's data plane (sd 010203)
  i-upf-1:
    container_name: i-upf-1
    image: free5gc/upf:latest
    command: bash -c "./upf-iptables.sh && ./upf -c ./config/upfcfg.yaml"
    volumes:
      - ./config/i-upf-1cfg.yaml:/free5gc/config/upfcfg.yaml
      - ./script/upf-iptables.sh:/free5gc/upf-iptables.sh
    cap_add:
      - NET_ADMIN
    networks:
      sbi:
        aliases:
          - i-upf-1.free5gc.org
      # shared with the free-ran-ue target's gnb service; must already exist
      cn-ran:
        ipv4_address: 10.0.1.5
        aliases:
          - n3-1.free5gc.org

  psa-upf-1:
    container_name: psa-upf-1
    image: free5gc/upf:latest
    command: bash -c "./upf-iptables.sh && ./upf -c ./config/upfcfg.yaml"
    volumes:
      - ./config/psa-upf-1cfg.yaml:/free5gc/config/upfcfg.yaml
      - ./script/upf-iptables.sh:/free5gc/upf-iptables.sh
    cap_add:
      - NET_ADMIN
    networks:
      sbi:
        aliases:
          - psa-upf-1.free5gc.org
      cn-ran:
        ipv4_address: 10.0.1.7
        aliases:
          - n9-1.free5gc.org

  # Slice 2's data plane (sd 112233)
  i-upf-2:
    container_name: i-upf-2
    image: free5gc/upf:latest
    command: bash -c "./upf-iptables.sh && ./upf -c ./config/upfcfg.yaml"
    volumes:
      - ./config/i-upf-2cfg.yaml:/free5gc/config/upfcfg.yaml
      - ./script/upf-iptables.sh:/free5gc/upf-iptables.sh
    cap_add:
      - NET_ADMIN
    networks:
      sbi:
        aliases:
          - i-upf-2.free5gc.org
      cn-ran:
        ipv4_address: 10.0.1.9
        aliases:
          - n3-2.free5gc.org

  psa-upf-2:
    container_name: psa-upf-2
    image: free5gc/upf:latest
    command: bash -c "./upf-iptables.sh && ./upf -c ./config/upfcfg.yaml"
    volumes:
      - ./config/psa-upf-2cfg.yaml:/free5gc/config/upfcfg.yaml
      - ./script/upf-iptables.sh:/free5gc/upf-iptables.sh
    cap_add:
      - NET_ADMIN
    networks:
      sbi:
        aliases:
          - psa-upf-2.free5gc.org
      cn-ran:
        ipv4_address: 10.0.1.11
        aliases:
          - n9-2.free5gc.org

  webconsole:
    container_name: webconsole
    image: free5gc/webui:latest
    command: ./webui -c ./config/webconsolecfg.yaml
    expose:
      - "2121"
    volumes:
      - ./config/free5gc-consolecfg.yaml:/free5gc/config/webconsolecfg.yaml
    environment:
      - GIN_MODE=release
    networks:
      sbi:
        aliases:
          - webconsole
    ports:
      - "5000:5000"
      - "2122:2122"
      - "2121:2121"
    depends_on:
      - db
      - nrf

networks:
  # internal to this target only, nothing outside free5gc talks to it
  sbi:
    ipam:
      driver: default
      config:
        - subnet: 10.0.10.0/24
    driver_opts:
      com.docker.network.bridge.name: docker-sbi

  # shared with the free-ran-ue target (amf/i-upf-*/psa-upf-* <-> gnb). Not
  # owned by either compose project: created once, up front, by the backend
  # (docker network create frulab-cn-ran --subnet 10.0.1.0/24
  #  -o com.docker.network.bridge.name=docker-cn-ran)
  cn-ran:
    external: true
    name: frulab-cn-ran

volumes:
  dbdata:
