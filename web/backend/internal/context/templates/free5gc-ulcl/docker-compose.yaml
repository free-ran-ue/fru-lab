services:
  db:
    container_name: mongodb
    image: mongo:4.4
    command: mongod --port 27017
    expose:
      - "27017"
    volumes:
      - dbdata:/data/db
    networks:
      sbi:
        aliases:
          - db.free5gc.org

  amf:
    container_name: amf
    image: free5gc/amf:latest
    command: ./amf -c ./config/amfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/amfcfg.yaml:/free5gc/config/amfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - amf.free5gc.org
      # shared with the free-ran-ue target's gnb service; must already exist
      # (created once by the backend, not owned by this compose project)
      cn-ran:
        ipv4_address: 10.0.1.3
        aliases:
          - n2.free5gc.org
    depends_on:
      - nrf

  ausf:
    container_name: ausf
    image: free5gc/ausf:latest
    command: ./ausf -c ./config/ausfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/ausfcfg.yaml:/free5gc/config/ausfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - ausf.free5gc.org
    depends_on:
      - nrf

  chf:
    container_name: chf
    image: free5gc/chf:latest
    command: ./chf -c ./config/chfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/chfcfg.yaml:/free5gc/config/chfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - chf.free5gc.org
    depends_on:
      - db
      - nrf
      - webconsole

  nrf:
    container_name: nrf
    image: free5gc/nrf:latest
    command: ./nrf -c ./config/nrfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/nrfcfg.yaml:/free5gc/config/nrfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - nrf.free5gc.org
    depends_on:
      - db

  nssf:
    container_name: nssf
    image: free5gc/nssf:latest
    command: ./nssf -c ./config/nssfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/nssfcfg.yaml:/free5gc/config/nssfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - nssf.free5gc.org
    depends_on:
      - nrf

  pcf:
    container_name: pcf
    image: free5gc/pcf:latest
    command: ./pcf -c ./config/pcfcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/pcfcfg.yaml:/free5gc/config/pcfcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - pcf.free5gc.org
    depends_on:
      - nrf

  smf:
    container_name: smf
    image: free5gc/smf:latest
    command: ./smf -c ./config/smfcfg.yaml -u ./config/uerouting.yaml
    expose:
      - "8000"
    volumes:
      - ./config/smfcfg.yaml:/free5gc/config/smfcfg.yaml
      - ./config/uerouting.yaml:/free5gc/config/uerouting.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - smf.free5gc.org
    depends_on:
      - nrf
      - i-upf
      - psa-upf

  udm:
    container_name: udm
    image: free5gc/udm:latest
    command: ./udm -c ./config/udmcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/udmcfg.yaml:/free5gc/config/udmcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - udm.free5gc.org
    depends_on:
      - db
      - nrf

  udr:
    container_name: udr
    image: free5gc/udr:latest
    command: ./udr -c ./config/udrcfg.yaml
    expose:
      - "8000"
    volumes:
      - ./config/udrcfg.yaml:/free5gc/config/udrcfg.yaml
      - ./cert:/free5gc/cert
    environment:
      DB_URI: mongodb://db/free5gc
      GIN_MODE: release
    networks:
      sbi:
        aliases:
          - udr.free5gc.org
    depends_on:
      - db
      - nrf

  # Intermediate UPF: N3-facing (gNB) and N9-facing (psa-upf) - takes over
  # the plain "upf" service's cn-ran slot, since only one of the two
  # templates is ever deployed at a time.
  i-upf:
    container_name: i-upf
    image: free5gc/upf:latest
    command: bash -c "./upf-iptables.sh && ./upf -c ./config/upfcfg.yaml"
    volumes:
      - ./config/i-upfcfg.yaml:/free5gc/config/upfcfg.yaml
      - ./script/upf-iptables.sh:/free5gc/upf-iptables.sh
    cap_add:
      - NET_ADMIN
    networks:
      sbi:
        aliases:
          - i-upf.free5gc.org
      # shared with the free-ran-ue target's gnb service; must already exist
      cn-ran:
        ipv4_address: 10.0.1.5
        aliases:
          - n3.free5gc.org

  # PDU Session Anchor UPF: N9-facing (i-upf) and N6 (DN, external/implicit).
  # Reachable over the same shared cn-ran bridge as the rest of the core -
  # fru-lab collapses N2/N3/N9 onto that one bridge rather than modeling
  # each as its own network segment.
  psa-upf:
    container_name: psa-upf
    image: free5gc/upf:latest
    command: bash -c "./upf-iptables.sh && ./upf -c ./config/upfcfg.yaml"
    volumes:
      - ./config/psa-upfcfg.yaml:/free5gc/config/upfcfg.yaml
      - ./script/upf-iptables.sh:/free5gc/upf-iptables.sh
    cap_add:
      - NET_ADMIN
    networks:
      sbi:
        aliases:
          - psa-upf.free5gc.org
      cn-ran:
        ipv4_address: 10.0.1.7
        aliases:
          - n9.free5gc.org

  webconsole:
    container_name: webconsole
    image: free5gc/webui:latest
    command: ./webui -c ./config/webconsolecfg.yaml
    expose:
      - "2121"
    volumes:
      - ./config/free5gc-consolecfg.yaml:/free5gc/config/webconsolecfg.yaml
    environment:
      - GIN_MODE=release
    networks:
      sbi:
        aliases:
          - webconsole
    ports:
      - "5000:5000"
      - "2122:2122"
      - "2121:2121"
    depends_on:
      - db
      - nrf

networks:
  # internal to this target only, nothing outside free5gc talks to it
  sbi:
    ipam:
      driver: default
      config:
        - subnet: 10.0.10.0/24
    driver_opts:
      com.docker.network.bridge.name: docker-sbi

  # shared with the free-ran-ue target (amf/i-upf/psa-upf <-> gnb). Not
  # owned by either compose project: created once, up front, by the backend
  # (docker network create frulab-cn-ran --subnet 10.0.1.0/24
  #  -o com.docker.network.bridge.name=docker-cn-ran)
  cn-ran:
    external: true
    name: frulab-cn-ran

volumes:
  dbdata:
