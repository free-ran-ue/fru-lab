name: GolangCI-Lint

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  golangci:
    name: lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [ '1.26.2' ]
        # each Go module has its own go.mod and .golangci.yaml
        module: [ web/backend, tester ]
    steps:
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - uses: actions/checkout@v4

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          working-directory: ${{ matrix.module }}
          args: ./...