backend:
  username: "admin"
  password: "frulab"

  port: 8888

  jwt:
    secret: "fru-lab"
    expiresIn: 1h

  db:
    type: "bbolt"
    path: "/tmp/frulab.db"

  deploy:
    workDir: "/tmp/frulab-deploy"

  frontendFilePath: "build/frontend"

  tester:
    # fru-tester API (see tester.yaml). Leave url empty to disable the pages.
    url: "http://127.0.0.1:9100"
    apiToken: "frulab-tester"

logger:
  level: "info"